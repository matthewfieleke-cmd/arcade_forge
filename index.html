/* ---------------- PLAYER PROJECTILES ---------------- */
function updateProjectiles(dt){
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    p.life-=dt;
    if(p.life<=0){
      if(p.kind==='rocket')explodeCluster(p.x,p.y,p.dmg);
      projs.splice(i,1);
      continue;
    }
    if(p.kind==='slash'){
      p.t+=dt;
      p.x=pcx;p.y=pcy;
      continue;
    }
    if(p.kind==='beam'){
      /* instantaneous laser line: fades in place, no motion or cull */
      p.t+=dt;
      continue;
    }
    if(p.kind==='yarn'){
      p.spin+=8*dt*(p.vx<0?-1:1);
      for(const k in p.hitMap){
        p.hitMap[k]-=dt;
        if(p.hitMap[k]<=0)delete p.hitMap[k];
      }
      updateYarn(p,dt);
      continue;
    }
    if(p.kind==='rocket'){
      if(p.armT>0){
        /* launch phase: coast outward before the seeker head arms */
        p.armT-=dt;
        p.vx*=Math.max(0,1-1.2*dt);
        p.vy*=Math.max(0,1-1.2*dt);
      }else{
        const tgt=nearestEnemyTo(p.x,p.y,2200);
        if(tgt){
          const desired=Math.atan2(tgt.y+tgt.h/2-p.y,tgt.x+tgt.w/2-p.x);
          let cur=Math.atan2(p.vy,p.vx);
          const diff=normAngle(desired-cur);
          cur+=clamp(diff,-6.5*dt,6.5*dt);
          const sp=Math.min(560,Math.hypot(p.vx,p.vy)+760*dt);
          p.vx=Math.cos(cur)*sp;p.vy=Math.sin(cur)*sp;
        } else {
          const sp=Math.min(560,Math.hypot(p.vx,p.vy)+760*dt);
          const cur=Math.atan2(p.vy,p.vx);
          p.vx=Math.cos(cur)*sp;p.vy=Math.sin(cur)*sp;
        }
      }
      p.smokeT-=dt;
      while(p.smokeT<=0){
        p.smokeT+=0.028;
        spawnParticle(p.x,p.y,rand(-26,26),rand(-26,26),3.4,0.5,[210,210,220],[80,80,95],-30);
      }
    }
    if(p.kind==='fire'){
      p.emberT-=dt;
      if(p.emberT<=0){
        p.emberT=0.045;
        spawnParticle(p.x,p.y,rand(-30,30),rand(-30,30),3,0.3,[255,200,90],[255,60,20],0);
      }
    }
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    /* cull far off-camera */
    if(p.x<G.camX-260||p.x>G.camX+viewW+260||p.y<-260||p.y>viewH+260){
      projs.splice(i,1);
    }
  }
}

/* ---------------- YARN BALL PHASE MACHINE ----------------
   fly:    high arc, ricochets off the visible screen edges,
           each ground bounce decays until it grinds the floor
   roll:   scrapes along the surface for a beat
   return: boomerangs back through everything to the player   */
function yarnBounceSurface(p){
  for(const pl of platforms){
    if(p.x>pl.x-2&&p.x<pl.x+pl.w+2&&p.y+p.r>=pl.y&&p.y-p.r<pl.y+Math.max(22,pl.h)){
      return pl.y;
    }
  }
  for(const s of solids){
    if(p.x>s.x-2&&p.x<s.x+s.w+2&&p.y+p.r>=s.y&&p.y-p.r<s.y+Math.max(22,s.h)){
      return s.y;
    }
  }
  return null;
}
function yarnSupportY(p){
  for(const pl of platforms){
    if(p.x>pl.x-2&&p.x<pl.x+pl.w+2&&Math.abs((p.y+p.r)-pl.y)<8)return pl.y;
  }
  for(const s of solids){
    if(p.x>s.x-2&&p.x<s.x+s.w+2&&Math.abs((p.y+p.r)-s.y)<8)return s.y;
  }
  return null;
}
function updateYarn(p,dt){
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  if(p.phase==='return'){
    /* boomerang pass back to the cat, piercing everything */
    p.returnT-=dt;
    const dx=pcx-p.x,dy=pcy-p.y;
    const d=Math.hypot(dx,dy)||1;
    p.vx+=((dx/d)*640-p.vx)*Math.min(1,dt*6);
    p.vy+=((dy/d)*640-p.vy)*Math.min(1,dt*6);
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    if(Math.random()<0.35){
      spawnParticle(p.x,p.y,rand(-30,30),rand(-30,30),2.6,0.3,[255,150,220],[170,40,120],0);
    }
    if(d<28||p.returnT<=0){
      p.life=0;
      burstParticles(p.x,p.y,8,140,2.4,0.3,[255,150,220],[200,50,140],0);
    }
    return;
  }
  if(G.cfg.genre===1){
    if(p.phase==='roll'){
      /* halted: skid to a stop, hang for a beat, then boomerang */
      p.rollT-=dt;
      p.vx*=Math.max(0,1-6*dt);
      p.vy*=Math.max(0,1-6*dt);
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      if(Math.random()<0.25){
        spawnParticle(p.x,p.y,rand(-30,30),rand(-30,30),2,0.25,[255,150,220],[150,40,110],0);
      }
      if(p.rollT<=0){
        p.phase='return';
        p.returnT=2.4;
        burstParticles(p.x,p.y,10,170,2.6,0.35,[255,170,230],[200,50,140],0);
      }
      return;
    }
    /* fly: wall ricochet with drag until it stalls out (~2s from 650) */
    p.vx*=Math.max(0,1-1.2*dt);
    p.vy*=Math.max(0,1-1.2*dt);
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    for(const w of walls){
      if(!circleRectHit(p.x,p.y,p.r,w))continue;
      const ox1=p.x+p.r-w.x,ox2=w.x+w.w-(p.x-p.r);
      const oy1=p.y+p.r-w.y,oy2=w.y+w.h-(p.y-p.r);
      const ox=Math.min(ox1,ox2),oy=Math.min(oy1,oy2);
      if(ox<oy){
        if(ox1<ox2)p.x=w.x-p.r;else p.x=w.x+w.w+p.r;
        p.vx=-p.vx*0.86;
      }else{
        if(oy1<oy2)p.y=w.y-p.r;else p.y=w.y+w.h+p.r;
        p.vy=-p.vy*0.86;
      }
      burstParticles(p.x,p.y,4,90,2,0.2,[255,150,220],[200,50,140],0);
    }
    if(Math.hypot(p.vx,p.vy)<60){
      p.phase='roll';
      p.rollT=0.5;
      burstParticles(p.x,p.y,6,110,2.2,0.3,[255,150,220],[200,50,140],0);
    }
    return;
  }
  if(p.phase==='roll'){
    p.rollT-=dt;
    p.vx*=Math.max(0,1-1.4*dt);
    p.x+=p.vx*dt;
    const L=G.camX+p.r+2,R=G.camX+viewW-p.r-2;
    if(p.x<L){p.x=L;p.vx=Math.abs(p.vx);}
    else if(p.x>R){p.x=R;p.vx=-Math.abs(p.vx);}
    const support=yarnSupportY(p);
    if(support!==null){
      p.y=support-p.r;
      if(Math.random()<0.3){
        spawnParticle(p.x,p.y+p.r,rand(-30,30),-rand(10,60),2,0.25,[255,150,220],[150,40,110],120);
      }
    }else{
      /* rolled off a ledge: fall again until the next low bounce */
      p.phase='fly';
      p.vy=0;
    }
    if(p.rollT<=0){
      p.phase='return';
      p.returnT=2.4;
      p.vy=-160;
      burstParticles(p.x,p.y,10,170,2.6,0.35,[255,170,230],[200,50,140],0);
    }
    return;
  }
  /* fly */
  p.vy+=p.grav*dt;
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  const L=G.camX+p.r+2,R=G.camX+viewW-p.r-2;
  if(p.x<L){
    p.x=L;p.vx=Math.abs(p.vx);
    burstParticles(p.x,p.y,4,90,2,0.2,[255,150,220],[200,50,140],0);
  }else if(p.x>R){
    p.x=R;p.vx=-Math.abs(p.vx);
    burstParticles(p.x,p.y,4,90,2,0.2,[255,150,220],[200,50,140],0);
  }
  if(p.vy>0){
    const surf=yarnBounceSurface(p);
    if(surf!==null){
      p.y=surf-p.r;
      const newVy=-p.vy*0.62;
      p.vx*=0.99;
      if(Math.abs(newVy)<150){
        p.phase='roll';
        p.rollT=0.55;
        p.vy=0;
        burstParticles(p.x,p.y+p.r,6,110,2.2,0.3,[255,150,220],[200,50,140],60);
      }else{
        p.vy=newVy;
        burstParticles(p.x,p.y+p.r,4,90,2,0.2,[255,150,220],[200,50,140],0);
      }
    }
  }
  if(p.y<-40){p.y=-40;p.vy=Math.abs(p.vy)*0.6;}
  /* fell into a pit: boomerang home early instead of dying down there */
  if(p.y-p.r>viewH+60){
    p.phase='return';
    p.returnT=2.4;
  }
}

/* ---------------- CLUSTER EXPLOSIONS ---------------- */
function explodeCluster(x,y,dmg){
  spawnShockwave(x,y,110,'#ffb347');
  explode(x,y,72,dmg,9);
  for(let i=0;i<4;i++){
    clusters.push({x:x+rand(-48,48),y:y+rand(-48,48),t:0.08+i*0.07,r:46,dmg:dmg*0.6});
  }
}
function updateClusters(dt){
  for(let i=clusters.length-1;i>=0;i--){
    const c=clusters[i];
    c.t-=dt;
    if(c.t<=0){
      explode(c.x,c.y,c.r,c.dmg,4);
      clusters.splice(i,1);
    }
  }
}
function explode(x,y,radius,dmg,shake){
  for(const en of enemies){
    if(en.dead||isBuried(en))continue;
    const ecx=en.x+en.w/2,ecy=en.y+en.h/2;
    if(dist2(x,y,ecx,ecy)<(radius+Math.max(en.w,en.h)/2)**2)damageEnemy(en,dmg);
  }
  for(const hz of hazards){
    if(hz.kind!=='asteroid'||hz.dead)continue;
    if(dist2(x,y,hz.x,hz.y)<(radius+hz.r)**2){
      hz.hp-=dmg;
      spawnDmgText(hz.x,hz.y-hz.r-8,dmg);
      if(hz.hp<=0)destroyAsteroid(hz);
    }
  }
  burstParticles(x,y,18,330,3.6,0.5,[255,255,255],[255,179,71],60);
  burstParticles(x,y,8,140,5,0.35,[255,220,150],[255,90,20],0);
  if(shake)addShake(shake,0.3);
}

/* ============================================================
   ENEMIES
   ============================================================ */
function makeEnemy(x,y){
  const t=G.cfg.enemy,D=diffMods();
  const hp=(26+G.level*7)*[0.8,1.25,1.0][t]*D.eHp;
  return{
    id:eid++,x:x,y:y,
    w:t===2?38:(t===1?36:34),
    h:t===2?38:(t===1?40:36),
    vx:0,vy:0,hp:hp,maxHp:hp,
    t:Math.random()*9,type:t,dead:false,flashT:0,
    shootT:1+Math.random()*2,
    dir:Math.random()<0.5?-1:1,
    onGround:false,dmgAcc:0,dmgAccT:0,hitT:0,
    trail:[],trailT:0,
    rootState:'idle',rootT:0,rootCd:2.5+Math.random()*2.5,
    tipX:0,tipY:0,rootOffX:0,rootOffY:0,lockX:0,lockY:0
  };
}
function updateEnemies(dt){
  const D=diffMods(),spd=D.eSpd,g=G.cfg.genre;
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  for(const en of enemies){
    if(en.dead)continue;
    en.t+=dt;
    if(en.flashT>0)en.flashT-=dt;
    const ecx=en.x+en.w/2,ecy=en.y+en.h/2;
    const dx=pcx-ecx,dy=pcy-ecy;
    const distP=Math.hypot(dx,dy)||1;
    const onScreen=ecx>G.camX-60&&ecx<G.camX+viewW+60;

    if(en.type===0){
      /* GHOSTLY SPIRIT - phasing homing floater with afterimage trail */
      const sp=(42+G.level*4)*spd;
      en.vx+=((dx/distP)*sp-en.vx)*Math.min(1,dt*2.2);
      en.vy+=((dy/distP)*sp-en.vy)*Math.min(1,dt*2.2);
      en.x+=en.vx*dt;
      en.y+=en.vy*dt+Math.sin(en.t*3)*16*dt;
      if(g===0){
        en.x=clamp(en.x,G.camX-200,G.worldW-en.w);
        en.y=clamp(en.y,30,G.groundY-en.h*0.6);
      }
      en.trailT-=dt;
      if(en.trailT<=0){
        en.trailT=0.07;
        en.trail.push({x:en.x,y:en.y,a:0.32});
        if(en.trail.length>5)en.trail.shift();
      }
      for(const tr of en.trail)tr.a-=dt*1.1;
    } else if(en.type===1){
      /* EVIL ROBOT - armored walker / strafer with lasers */
      if(g===1){
        const sp=(72+G.level*5)*spd;
        if(distP>230){
          en.x+=(dx/distP)*sp*dt;
          en.y+=(dy/distP)*sp*dt;
        }else{
          en.x+=(-dy/distP)*sp*0.8*dt*en.dir;
          en.y+=(dx/distP)*sp*0.8*dt*en.dir;
        }
        resolveWalls(en);
        en.shootT-=dt;
        if(en.shootT<=0&&distP<560){
          fireEnemyShot(ecx,ecy,dx/distP,dy/distP,'laser',320+G.level*10);
          en.shootT=Math.max(1.4,2.8-G.level*0.1);
        }
      }else{
        const sp=(56+G.level*5)*spd;
        en.vy+=1500*dt;
        en.vx=Math.sign(dx)*sp;
        const prevY=en.y;
        en.x+=en.vx*dt;
        if(g===0)resolveSolidsX(en);
        en.y+=en.vy*dt;
        groundLand(en,prevY);
        en.shootT-=dt;
        if(en.shootT<=0&&onScreen&&Math.abs(dy)<70&&distP<540){
          fireEnemyShot(ecx,ecy,Math.sign(dx),0,'laser',340);
          en.shootT=Math.max(1.6,3.0-G.level*0.1);
        }
      }
    } else {
      updatePlant(en,dt,g,spd,dx,dy,distP,onScreen);
    }
    /* platformer: hostiles that tumble into a pit are lost down there */
    if(g===0&&en.y>viewH+260&&!(en.type===2&&en.rootState!=='idle'))en.dead=true;
  }
}

/* ---------------- PLANT MONSTER ROOT AMBUSH ----------------
   idle -> buries (untargetable) -> root bulge slithers along the
   ground chasing the player -> locks under them (random offset)
   -> erupts with terrain-themed dirt + AoE bite -> idle again   */
function dirtColors(){
  const env=G.cfg.env;
  if(env===0)return[[140,70,30],[255,120,40]];
  if(env===1)return[[170,180,200],[70,80,105]];
  return[[150,95,200],[60,35,95]];
}
function rootSurfaceAt(x,refY){
  /* topmost solid surface at x that sits at/below the reference feet level */
  let best=null;
  for(const s of solids){
    if(x<s.x||x>s.x+s.w)continue;
    if(s.y<refY-8)continue;
    if(best===null||s.y<best)best=s.y;
  }
  return best;
}
function updatePlant(en,dt,g,spd,dx,dy,distP,onScreen){
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  const dc=dirtColors();
  if(en.rootState==='idle'){
    if(g===0){
      en.vy+=1500*dt;
      const prevY=en.y;
      en.y+=en.vy*dt;
      groundLand(en,prevY);
    }
    en.vx*=Math.max(0,1-3*dt);
    en.x+=en.vx*dt;
    if(g===0)resolveSolidsX(en);
    if(g===1)resolveWalls(en);
    en.shootT-=dt;
    if(en.shootT<=0&&onScreen&&distP<500){
      if(g===1){
        fireEnemyShot(en.x+en.w/2,en.y+en.h/2,dx/distP,dy/distP,'seed',240);
      }else{
        const svx=clamp(dx*1.3,-330,330);
        eprojs.push({kind:'seed',x:en.x+en.w/2,y:en.y+en.h*0.2,vx:svx,vy:-360,r:6,dmg:8,grav:950,life:3});
      }
      en.shootT=Math.max(1.3,2.5-G.level*0.07);
    }
    en.rootCd-=dt;
    if(en.rootCd<=0&&distP<520&&onScreen&&(g===1||en.onGround)){
      en.rootState='root';
      en.rootT=0;
      en.tipX=en.x+en.w/2;
      en.tipY=g===0?G.groundY:en.y+en.h/2;
      en.rootOffX=rand(-60,60);
      en.rootOffY=g===1?rand(-60,60):0;
      burstParticles(en.x+en.w/2,en.y+en.h,12,170,3,0.45,dc[0],dc[1],240);
    }
    return;
  }
  if(en.rootState==='root'){
    en.rootT+=dt;
    const sp=(230+G.level*8)*spd;
    const tx=pcx+en.rootOffX;
    let arrived=false;
    if(g===0){
      const step=clamp(tx-en.tipX,-sp*dt,sp*dt);
      en.tipX+=step;
      en.tipX=clamp(en.tipX,20,G.worldW-20);
      en.tipY=G.groundY;
      arrived=Math.abs(tx-en.tipX)<10;
    }else{
      const ty=pcy+en.rootOffY;
      const d=Math.hypot(tx-en.tipX,ty-en.tipY)||1;
      en.tipX+=(tx-en.tipX)/d*sp*dt;
      en.tipY+=(ty-en.tipY)/d*sp*dt;
      en.tipX=clamp(en.tipX,30,viewW-30);
      en.tipY=clamp(en.tipY,30,viewH-30);
      arrived=d<12;
    }
    if(Math.random()<0.35){
      spawnParticle(en.tipX+rand(-8,8),(g===0?G.groundY:en.tipY)+rand(-4,2),
        rand(-30,30),-rand(20,80),2.2,0.3,dc[0],dc[1],160);
    }
    if(en.rootT>2||(arrived&&en.rootT>0.6)){
      en.lockX=en.tipX;
      if(g===0){
        let sy=rootSurfaceAt(en.lockX,player.y+player.h);
        let tries=0;
        while(sy===null&&tries<10){
          en.lockX+=(en.lockX<pcx?-1:1)*-24;
          en.lockX=clamp(en.lockX,20,G.worldW-20);
          sy=rootSurfaceAt(en.lockX,viewH+300);
          tries++;
        }
        en.lockY=sy===null?G.groundY:sy;
      }else{
        en.lockY=en.tipY;
      }
      en.rootState='pop';
      en.rootT=0;
    }
    return;
  }
  /* pop: telegraphed mound, then eruption */
  en.rootT+=dt;
  if(Math.random()<0.5){
    spawnParticle(en.lockX+rand(-12,12),en.lockY+rand(-4,2),
      rand(-40,40),-rand(40,120),2.4,0.3,dc[0],dc[1],200);
  }
  if(en.rootT>=0.42){
    if(g===0){en.x=en.lockX-en.w/2;en.y=en.lockY-en.h;}
    else{en.x=en.lockX-en.w/2;en.y=en.lockY-en.h/2;}
    en.vx=0;en.vy=0;
    burstParticles(en.lockX,en.lockY,18,240,3.4,0.55,dc[0],dc[1],260);
    burstParticles(en.lockX,en.lockY-8,8,160,2.6,0.4,[255,255,255],dc[1],100);
    addShake(4,0.2);
    const pd=Math.hypot(pcx-en.lockX,pcy-en.lockY);
    if(pd<58&&!player.dead){
      damagePlayer(12);
      const kx=Math.sign(pcx-en.lockX)||1;
      if(g===1){player.vx+=kx*230;player.vy+=Math.sign(pcy-en.lockY)*230;}
      else{player.vx=kx*230;player.vy=-200;}
    }
    en.rootState='idle';
    en.rootCd=6+rand(0,1.5);
    en.shootT=Math.max(en.shootT,0.8);
  }
}
function fireEnemyShot(x,y,nx,ny,kind,speed){
  eprojs.push({kind:kind,x:x,y:y,vx:nx*speed,vy:ny*speed,r:kind==='seed'?6:4,
    dmg:kind==='seed'?8:10,grav:0,life:2.6});
}
function updateEnemyProjectiles(dt){
  for(let i=eprojs.length-1;i>=0;i--){
    const p=eprojs[i];
    p.life-=dt;
    p.vy+=(p.grav||0)*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    if(p.life<=0||p.x<G.camX-200||p.x>G.camX+viewW+200||p.y>viewH+200||p.y<-200){
      eprojs.splice(i,1);
    }
  }
}
/* ---------------- FLOATING DAMAGE NUMBERS ---------------- */
function spawnDmgText(x,y,val){
  if(val<1)return;
  dmgTexts.push({x:x,y:y,vy:-54,t:0,life:0.75,val:Math.round(val)});
  if(dmgTexts.length>40)dmgTexts.shift();
}
function flushEnemyDmg(en){
  if(en.dmgAcc>=1)spawnDmgText(en.x+en.w/2+rand(-9,9),en.y-12,en.dmgAcc);
  en.dmgAcc=0;
  en.dmgAccT=0;
}
function updateDmgTexts(dt){
  /* rapid multi-hits (aura ticks, yarn grinds) merge into one number */
  for(const en of enemies){
    if(en.dmgAccT>0){
      en.dmgAccT-=dt;
      if(en.dmgAccT<=0)flushEnemyDmg(en);
    }
    if(en.hitT>0)en.hitT-=dt;
  }
  for(let i=dmgTexts.length-1;i>=0;i--){
    const d=dmgTexts[i];
    d.t+=dt;
    d.y+=d.vy*dt;
    d.vy*=Math.max(0,1-2.4*dt);
    if(d.t>=d.life)dmgTexts.splice(i,1);
  }
}
function damageEnemy(en,dmg){
  if(en.dead)return;
  en.hp-=dmg;
  en.flashT=0.09;
  en.hitT=0.15;
  en.dmgAcc=(en.dmgAcc||0)+dmg;
  en.dmgAccT=0.18;
  /* radial white/yellow particle stars on every projectile impact */
  burstParticles(en.x+en.w/2,en.y+en.h/2,6,200,2.6,0.3,[255,255,255],[255,230,90],0);
  if(en.hp<=0)killEnemy(en);
}
function killEnemy(en){
  en.dead=true;
  flushEnemyDmg(en);
  G.kills++;G.totalKills++;
  G.score+=(80+en.type*20)*diffMods().score;
  addUlt(9);
  const acc=[[191,234,255],[255,107,107],[125,255,168]][en.type];
  burstParticles(en.x+en.w/2,en.y+en.h/2,10,260,3.2,0.55,[255,255,255],acc,80);
  /* death dissolve: the body breaks apart into drifting pixels */
  for(let i=0;i<12;i++){
    spawnParticle(en.x+rand(2,en.w-2),en.y+rand(2,en.h-2),
      rand(-60,60),rand(-90,20),3.2+rand(0,2),0.5+rand(0,0.35),acc,
      [acc[0]*0.4,acc[1]*0.4,acc[2]*0.4],220);
  }
  if(Math.random()<0.2)spawnPickup(en.x+en.w/2,en.y+en.h/2);
}

/* ============================================================
   ENVIRONMENT HAZARDS - lava / asteroids / phantoms
   ============================================================ */
function spawnHazard(){
  const env=G.cfg.env,g=G.cfg.genre;
  const pcx=player.x+player.w/2;
  if(env===0){
    if(g===1){
      hazards.push({kind:'pool',x:rand(60,viewW-60),y:rand(60,viewH-60),
        r:54,t:0,warn:0.9,live:2.2,dead:false});
    }else{
      const gx=clamp(pcx+rand(-80,420),G.camX+40,G.camX+viewW+300);
      hazards.push({kind:'geyser',x:gx,y:G.groundY,w:38,hgt:160,
        t:0,warn:0.8,live:0.9,dead:false});
    }
  } else if(env===1){
    /* asteroid: flashing entry warning first, then a rock aimed at the player */
    let rx,ry;
    if(g===1){
      const side=Math.floor(Math.random()*4);
      if(side===0){rx=rand(40,viewW-40);ry=-36;}
      else if(side===1){rx=viewW+36;ry=rand(40,viewH*0.6);}
      else if(side===2){rx=rand(40,viewW-40);ry=viewH+36;}
      else{rx=-36;ry=rand(40,viewH*0.6);}
    }else if(Math.random()<0.6){
      rx=viewW+40;ry=rand(40,viewH*0.55);
    }else{
      rx=rand(viewW*0.25,viewW*0.95);ry=-40;
    }
    hazards.push({kind:'awarn',t:0.75,rx:rx,ry:ry,dead:false});
  } else {
    const a=Math.random()*TAU;
    const d=rand(150,300);
    let px=player.x+player.w/2+Math.cos(a)*d;
    let py=player.y+player.h/2+Math.sin(a)*d;
    if(G.cfg.genre===1){px=clamp(px,40,viewW-40);py=clamp(py,40,viewH-40);}
    else{px=clamp(px,G.camX+30,G.camX+viewW-30);py=clamp(py,40,G.groundY-30);}
    hazards.push({kind:'phantom',x:px,y:py,r:20,t:0,life:4.3,alpha:0,dead:false});
  }
}
function spawnAsteroidNow(warn){
  const g=G.cfg.genre;
  const x=g===1?warn.rx:G.camX+warn.rx;
  const y=warn.ry;
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  const tx=pcx+rand(-70,70);
  const ty=pcy+rand(-50,50);
  const d=Math.hypot(tx-x,ty-y)||1;
  const sp=g===1?(150+G.level*10):(235+G.level*12+rand(0,50));
  const r=16+rand(0,11);
  const verts=[];
  for(let i=0;i<8;i++)verts.push(0.72+hash01(i*3.7+x)*0.36);
  hazards.push({kind:'asteroid',id:eid++,x:x,y:y,
    vx:(tx-x)/d*sp,vy:(ty-y)/d*sp,r:r,
    hp:18+G.level*4,rot:rand(0,TAU),rotV:rand(-2,2),verts:verts,dead:false});
}
function destroyAsteroid(hz){
  hz.dead=true;
  G.score+=40*diffMods().score;
  burstParticles(hz.x,hz.y,12,220,3,0.5,[200,205,215],[90,95,110],150);
  burstParticles(hz.x,hz.y,6,160,2.4,0.3,[255,255,255],[255,230,90],0);
}
function updateHazards(dt){
  for(const hz of hazards){
    if(hz.dead)continue;
    if(hz.kind==='awarn'){
      hz.t-=dt;
      if(hz.t<=0){
        hz.dead=true;
        spawnAsteroidNow(hz);
      }
    } else if(hz.kind==='geyser'){
      hz.t+=dt;
      if(hz.t>=hz.warn+hz.live){hz.dead=true;continue;}
      if(hz.t>=hz.warn){
        if(Math.random()<0.5){
          spawnParticle(hz.x+rand(-14,14),G.groundY-rand(0,hz.hgt),
            rand(-30,30),-rand(60,200),3,0.4,[255,220,120],[255,70,10],300);
        }
        const col={x:hz.x-hz.w/2,y:G.groundY-hz.hgt,w:hz.w,h:hz.hgt};
        if(rectsOverlap(player,col))damagePlayer(16);
      }
    } else if(hz.kind==='pool'){
      hz.t+=dt;
      if(hz.t>=hz.warn+hz.live){hz.dead=true;continue;}
      if(hz.t>=hz.warn){
        if(Math.random()<0.4){
          spawnParticle(hz.x+rand(-hz.r,hz.r)*0.7,hz.y+rand(-hz.r,hz.r)*0.7,
            rand(-20,20),-rand(40,120),2.6,0.4,[255,220,120],[255,70,10],150);
        }
        if(circleRectHit(hz.x,hz.y,hz.r*0.92,player))damagePlayer(14);
      }
    } else if(hz.kind==='asteroid'){
      hz.x+=hz.vx*dt;
      hz.y+=hz.vy*dt;
      hz.rot+=hz.rotV*dt;
      if(hz.x<G.camX-160||hz.x>G.camX+viewW+260||hz.y>viewH+160||hz.y<-160)hz.dead=true;
      if(circleRectHit(hz.x,hz.y,hz.r,player)){
        damagePlayer(16);
        destroyAsteroid(hz);
      }
    } else if(hz.kind==='phantom'){
      hz.t+=dt;
      if(hz.t>=hz.life){hz.dead=true;continue;}
      if(hz.t<0.7)hz.alpha=hz.t/0.7;
      else if(hz.t>hz.life-0.7)hz.alpha=(hz.life-hz.t)/0.7;
      else hz.alpha=1;
      if(hz.t>0.7&&hz.t<hz.life-0.7){
        const dx=player.x+player.w/2-hz.x,dy=player.y+player.h/2-hz.y;
        const d=Math.hypot(dx,dy)||1;
        const sp=(46+G.level*4)*diffMods().eSpd;
        hz.x+=dx/d*sp*dt;
        hz.y+=dy/d*sp*dt;
      }
      if(hz.alpha>0.5&&circleRectHit(hz.x,hz.y,hz.r,player))damagePlayer(10);
    }
  }
}

/* ---------------- SPAWN DIRECTORS (per genre + environment) ---------------- */
function updateSpawners(dt){
  const D=diffMods(),g=G.cfg.genre;
  /* environment hazard director */
  G.envT-=dt;
  if(G.envT<=0){
    spawnHazard();
    G.envT=Math.max(1.1,3.9-G.level*0.22)/D.spawn;
  }
  if(g===1){
    /* arena: telegraphed wave spawns up to the kill quota */
    if(G.spawned<G.killQuota){
      G.enSpawnT-=dt;
      const aliveCount=enemies.length+telegraphs.length;
      if(G.enSpawnT<=0&&aliveCount<G.maxAlive){
        let tx,ty,tries=0;
        do{
          tx=rand(50,viewW-90);
          ty=rand(50,viewH-90);
          tries++;
        }while(tries<12&&dist2(tx,ty,player.x,player.y)<160*160);
        telegraphs.push({x:tx,y:ty,t:0.75});
        G.spawned++;
        G.enSpawnT=Math.max(0.4,1.7-G.level*0.09)/D.spawn;
      }
    }
    for(let i=telegraphs.length-1;i>=0;i--){
      const tg=telegraphs[i];
      tg.t-=dt;
      if(tg.t<=0){
        enemies.push(makeEnemy(tg.x,tg.y));
        burstParticles(tg.x+17,tg.y+18,8,140,2.4,0.3,[255,107,107],[120,20,40],0);
        telegraphs.splice(i,1);
      }
    }
  }
}

/* ============================================================
   ITEM CRATES (pickups)
   ============================================================ */
function spawnPickup(x,y){
  const r=Math.random();
  const kind=r<0.4?0:(r<0.7?1:2);
  pickups.push({x:x,y:y,kind:kind,t:0,life:12});
}
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    pk.t+=dt;pk.life-=dt;
    if(pk.life<=0){
      pickups.splice(i,1);
      continue;
    }
    const box={x:pk.x-15,y:pk.y-15,w:30,h:30};
    if(!player.dead&&rectsOverlap(player,box)){
      applyPickup(pk);
      pickups.splice(i,1);
    }
  }
}
function applyPickup(pk){
  G.score+=25*diffMods().score;
  if(pk.kind===0){
    player.hp=Math.min(player.maxHp,player.hp+player.maxHp*0.35);
    burstParticles(pk.x,pk.y,10,160,2.6,0.4,[180,255,200],[30,200,90],0);
  }else if(pk.kind===1){
    player.shield=Math.min(player.maxShield,player.shield+player.maxShield*0.6);
    burstParticles(pk.x,pk.y,10,160,2.6,0.4,[160,210,255],[40,90,220],0);
  }else{
    addUlt(35);
    burstParticles(pk.x,pk.y,10,160,2.6,0.4,[255,240,160],[230,180,20],0);
  }
}

/* ============================================================
   COLLISION REGISTERS
   ============================================================ */
function projHitsEnemy(p,en){
  if(p.kind==='slash'){
    const ecx=en.x+en.w/2,ecy=en.y+en.h/2;
    const dx=ecx-p.x,dy=ecy-p.y;
    const d=Math.hypot(dx,dy);
    if(d>p.range+Math.max(en.w,en.h)*0.5)return false;
    if(d<16)return true;
    return(dx*p.ax+dy*p.ay)/d>0.34;
  }
  return circleRectHit(p.x,p.y,p.r||5,en);
}
function handleProjectileHits(){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    if(p.kind==='beam'){
      const x2=p.x+p.ax*p.len,y2=p.y+p.ay*p.len;
      for(const en of enemies){
        if(en.dead||isBuried(en)||p.hitSet.has(en.id))continue;
        const ecx=en.x+en.w/2,ecy=en.y+en.h/2;
        if(distPointSeg(ecx,ecy,p.x,p.y,x2,y2)<=Math.max(en.w,en.h)*0.5+p.width){
          p.hitSet.add(en.id);
          damageEnemy(en,p.dmg);
        }
      }
      for(const hz of hazards){
        if(hz.kind!=='asteroid'||hz.dead)continue;
        const key='a'+hz.id;
        if(p.hitSet.has(key))continue;
        if(distPointSeg(hz.x,hz.y,p.x,p.y,x2,y2)<=hz.r+p.width){
          p.hitSet.add(key);
          hz.hp-=p.dmg;
          spawnDmgText(hz.x,hz.y-hz.r-8,p.dmg);
          burstParticles(hz.x,hz.y,5,170,2.4,0.25,[255,255,255],[255,230,90],0);
          if(hz.hp<=0)destroyAsteroid(hz);
        }
      }
      continue;
    }
    let removed=false;
    for(const en of enemies){
      if(en.dead||isBuried(en))continue;
      if(!projHitsEnemy(p,en))continue;
      if(p.kind==='slash'||p.kind==='fire'){
        if(p.hitSet.has(en.id))continue;
        p.hitSet.add(en.id);
        damageEnemy(en,p.dmg);
      }else if(p.kind==='yarn'){
        if(p.hitMap[en.id]>0)continue;
        p.hitMap[en.id]=0.35;
        damageEnemy(en,p.dmg);
      }else if(p.kind==='rocket'){
        explodeCluster(p.x,p.y,p.dmg);
        removed=true;
        break;
      }else{
        damageEnemy(en,p.dmg);
        removed=true;
        break;
      }
    }
    if(!removed&&p.kind!=='slash'){
      for(const hz of hazards){
        if(hz.kind!=='asteroid'||hz.dead)continue;
        if(dist2(p.x,p.y,hz.x,hz.y)>(((p.r||5)+hz.r)**2))continue;
        if(p.kind==='rocket'){
          explodeCluster(p.x,p.y,p.dmg);
          removed=true;
        }else if(p.kind==='yarn'){
          hz.hp-=p.dmg;
          spawnDmgText(hz.x,hz.y-hz.r-8,p.dmg);
        }else if(p.kind==='fire'){
          const key='a'+hz.id;
          if(!p.hitSet.has(key)){
            p.hitSet.add(key);
            hz.hp-=p.dmg;
            spawnDmgText(hz.x,hz.y-hz.r-8,p.dmg);
          }
        }else{
          hz.hp-=p.dmg;
          spawnDmgText(hz.x,hz.y-hz.r-8,p.dmg);
          removed=true;
        }
        burstParticles(p.x,p.y,5,170,2.4,0.25,[255,255,255],[255,230,90],0);
        if(hz.hp<=0)destroyAsteroid(hz);
        break;
      }
    }
    if(removed)projs.splice(i,1);
  }
}
function handlePlayerCollisions(dt){
  if(player.dead)return;
  /* enemy contact (suspended while the timeline is frozen) */
  if(!G.isTimeStopped){
    for(const en of enemies){
      if(en.dead||isBuried(en))continue;
      if(!rectsOverlap(player,en))continue;
      if(player.shieldUltT>0){
        damageEnemy(en,90*dt);
        continue;
      }
      damagePlayer([10,14,12][en.type]);
      const kx=Math.sign(player.x-en.x)||1;
      if(G.cfg.genre===1){player.vx+=kx*200;player.vy+=Math.sign(player.y-en.y)*200;}
      else player.vx=kx*180;
    }
    for(let i=eprojs.length-1;i>=0;i--){
      const p=eprojs[i];
      if(circleRectHit(p.x,p.y,p.r,player)){
        damagePlayer(p.dmg);
        burstParticles(p.x,p.y,5,130,2.2,0.25,[255,160,140],[200,40,30],0);
        eprojs.splice(i,1);
      }
    }
  } else if(player.shieldUltT>0){
    for(const en of enemies){
      if(!en.dead&&!isBuried(en)&&rectsOverlap(player,en))damageEnemy(en,90*dt);
    }
  }
}
function damagePlayer(amount){
  if(player.dead||player.invulnT>0||player.shieldUltT>0)return;
  let d=amount*diffMods().dmgTaken;
  if(player.shield>0){
    const absorbed=Math.min(player.shield,d);
    player.shield-=absorbed;
    d-=absorbed;
    player.shieldHitT=0.35;
    burstParticles(player.x+player.w/2,player.y+player.h/2,7,170,2.6,0.3,[160,210,255],[40,90,220],0);
  }
  if(d>0){
    player.hp-=d;
    G.dmgFlash=0.35;
    burstParticles(player.x+player.w/2,player.y+player.h/2,7,170,2.6,0.3,[255,150,150],[200,30,30],0);
  }
  player.invulnT=0.9;
  addShake(4,0.2);
  if(player.hp<=0){player.hp=0;die();}
}
function cleanupDead(){
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);
  for(let i=hazards.length-1;i>=0;i--)if(hazards[i].dead)hazards.splice(i,1);
}

/* ============================================================
   PROCEDURAL RENDER PIPELINE
   ============================================================ */
function render(){
  let sx=0,sy=0;
  if(G.shakeT>0){
    const amp=G.shakeMag*(G.shakeT/G.shakeDur);
    sx=rand(-1,1)*amp;
    sy=rand(-1,1)*amp;
  }
  ctx.clearRect(0,0,viewW,viewH);
  drawBackground();
  ctx.save();
  ctx.translate(-G.camX+sx,-G.camY+sy);
  drawGeometry();
  drawTelegraphs();
  drawHazards();
  drawPickups();
  drawEnemies();
  if(!player.dead)drawPlayer();
  drawWisps();
  drawEnemyProjectiles();
  drawProjectiles();
  drawShockwaves();
  drawParticles();
  drawDmgTexts();
  ctx.restore();
  if(G.isTimeStopped)drawTimeStopOverlay();
  drawSpeedLines();
  drawHUD();
  drawControls();
  drawBanner();
  drawDamageVignette();
  drawLevelFlash();
}

/* ---------------- BACKGROUNDS (parallax, per environment) ---------------- */
function drawBackground(){
  const pal=envPal();
  const grd=ctx.createLinearGradient(0,0,0,viewH);
  grd.addColorStop(0,pal.sky0);
  grd.addColorStop(1,pal.sky1);
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,viewW,viewH);
  const env=G.cfg.env;
  if(env===0){
    /* volcano silhouettes with live eruptions + wavy lava river + embers + ash */
    for(let i=0;i<3;i++){
      const bx=((i*viewW*0.55-G.camX*0.25)%(viewW*1.6)+viewW*1.6)%(viewW*1.6)-viewW*0.3;
      const bw=viewW*0.5,bh=viewH*(0.3+i*0.06);
      const peakX=bx+bw*0.5,peakY=viewH-bh;
      ctx.fillStyle='rgba(20,6,4,0.85)';
      ctx.beginPath();
      ctx.moveTo(bx,viewH);
      ctx.lineTo(peakX,peakY);
      ctx.lineTo(bx+bw,viewH);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='rgba(255,110,40,0.25)';
      ctx.fillRect(peakX-bw*0.03,peakY,bw*0.06,8);
      /* periodic eruption spray from the caldera */
      const cyc=4+i;
      const phase=(G.gameTime+i*1.7)%cyc;
      if(phase<1.3){
        for(let j=0;j<7;j++){
          const tj=phase-j*0.1;
          if(tj<0||tj>1)continue;
          const evx=(hash01(i*31+j*7)-0.5)*120;
          const evy=120+hash01(i*13+j*3)*110;
          const px=peakX+evx*tj;
          const py=peakY-(evy*tj-170*tj*tj);
          ctx.fillStyle='rgba(255,'+Math.floor(150+hash01(j*5)*80)+',50,'+(0.8*(1-tj)).toFixed(2)+')';
          ctx.fillRect(px-1.8,py-1.8,3.6,3.6);
        }
        const gl=0.25*(1-phase/1.3);
        ctx.fillStyle='rgba(255,140,50,'+gl.toFixed(2)+')';
        ctx.beginPath();
        ctx.arc(peakX,peakY,26,0,TAU);
        ctx.fill();
      }
    }
    /* flowing wavy lava river along the horizon (platformer backdrop) */
    if(G.cfg.genre===0){
      const ry=viewH*0.705;
      const wob=(x)=>Math.sin(x*0.025-G.gameTime*2.4)*5+Math.sin(x*0.011+G.gameTime*1.3)*3;
      const rg=ctx.createLinearGradient(0,ry-12,0,ry+16);
      rg.addColorStop(0,'rgba(255,210,110,0.85)');
      rg.addColorStop(0.5,'rgba(255,110,30,0.8)');
      rg.addColorStop(1,'rgba(150,30,8,0.75)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.moveTo(0,ry+wob(G.camX*0.35));
      for(let x=0;x<=viewW;x+=18)ctx.lineTo(x,ry+wob(x+G.camX*0.35));
      for(let x=viewW;x>=0;x-=18)ctx.lineTo(x,ry+13+wob(x+G.camX*0.35+90)*0.7);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='rgba(255,235,160,0.5)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let x=0;x<=viewW;x+=18){
        const yy=ry+4+wob(x+G.camX*0.35+40)*0.8;
        if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    const hg=ctx.createLinearGradient(0,viewH*0.6,0,viewH);
    hg.addColorStop(0,'rgba(255,90,20,0)');
    hg.addColorStop(1,'rgba(255,90,20,0.22)');
    ctx.fillStyle=hg;
    ctx.fillRect(0,viewH*0.6,viewW,viewH*0.4);
    for(let i=0;i<22;i++){
      const ex=((hash01(i*9.1)*viewW*2-G.camX*0.4)%viewW+viewW)%viewW;
      const ey=viewH-((hash01(i*4.7)*viewH+G.gameTime*(18+hash01(i)*30))%viewH);
      ctx.fillStyle='rgba(255,'+Math.floor(120+hash01(i*2.3)*90)+',40,'+(0.25+hash01(i*5.9)*0.4).toFixed(2)+')';
      ctx.fillRect(ex,ey,2.4,2.4);
    }
    /* drifting ash flakes sinking down */
    for(let i=0;i<14;i++){
      const ax=((hash01(i*17.3)*viewW*2-G.camX*0.3+Math.sin(G.gameTime*0.8+i)*30)%viewW+viewW)%viewW;
      const ay=((hash01(i*7.7)*viewH+G.gameTime*(26+hash01(i*3)*22))%viewH);
      ctx.fillStyle='rgba(200,190,185,'+(0.18+hash01(i*5.1)*0.2).toFixed(2)+')';
      ctx.fillRect(ax,ay,2,2);
    }
  } else if(env===1){
    /* planets + starfield + shooting stars + passing rockets + hull lattice */
    const plDefs=[
      {px:0.2,py:0.16,r:34,c0:'#3a5f8f',c1:'#101d33',ring:false},
      {px:0.74,py:0.34,r:22,c0:'#8f5f3a',c1:'#33200f',ring:true}
    ];
    for(const pl of plDefs){
      const px=((pl.px*viewW*1.6-G.camX*0.08)%(viewW*1.6)+viewW*1.6)%(viewW*1.6)-viewW*0.3;
      const py=pl.py*viewH;
      const pg=ctx.createRadialGradient(px-pl.r*0.35,py-pl.r*0.35,pl.r*0.15,px,py,pl.r);
      pg.addColorStop(0,pl.c0);
      pg.addColorStop(1,pl.c1);
      ctx.fillStyle=pg;
      ctx.beginPath();
      ctx.arc(px,py,pl.r,0,TAU);
      ctx.fill();
      if(pl.ring){
        ctx.strokeStyle='rgba(200,170,130,0.5)';
        ctx.lineWidth=2.5;
        ctx.beginPath();
        ctx.ellipse(px,py,pl.r*1.7,pl.r*0.5,-0.35,0,TAU);
        ctx.stroke();
      }
    }
    for(let i=0;i<110;i++){
      const depth=0.15+hash01(i*7.1)*0.5;
      const x=((hash01(i*13.7)*2400-G.camX*depth)%viewW+viewW)%viewW;
      const y=hash01(i*29.3)*viewH;
      const s=hash01(i*51.7)*1.8+0.5;
      const tw=0.35+0.6*Math.abs(Math.sin(G.gameTime*(0.6+hash01(i)*2.2)+i));
      ctx.fillStyle='rgba(200,225,255,'+tw.toFixed(2)+')';
      ctx.fillRect(x,y,s,s);
    }
    /* shooting star streak every few seconds */
    const ssCyc=Math.floor(G.gameTime/5.5);
    const ssK=(G.gameTime%5.5)/0.55;
    if(ssK<1){
      const sx=viewW*(0.15+hash01(ssCyc*3.7)*0.7)+ssK*210;
      const sy=viewH*(0.08+hash01(ssCyc*9.1)*0.3)+ssK*120;
      ctx.strokeStyle='rgba(235,245,255,'+(0.8*(1-ssK)).toFixed(2)+')';
      ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(sx-58,sy-33);
      ctx.lineTo(sx,sy);
      ctx.stroke();
    }
    /* tiny patrol rocket crossing the station */
    const rkCyc=Math.floor(G.gameTime/9);
    const rkK=(G.gameTime%9)/4.2;
    if(rkK<1){
      const dir=hash01(rkCyc*5.3)<0.5?1:-1;
      const rx=dir>0?(-60+rkK*(viewW+120)):(viewW+60-rkK*(viewW+120));
      const ry2=viewH*(0.14+hash01(rkCyc*2.9)*0.32);
      ctx.save();
      ctx.translate(rx,ry2);
      ctx.scale(dir,1);
      ctx.fillStyle='#aebdd4';
      ctx.beginPath();
      ctx.moveTo(13,0);ctx.lineTo(2,-4.5);ctx.lineTo(-9,-3.5);
      ctx.lineTo(-9,3.5);ctx.lineTo(2,4.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='rgba(120,200,255,0.85)';
      ctx.fillRect(4,-2,4,4);
      ctx.fillStyle='rgba(255,'+(150+Math.floor(Math.random()*80))+',60,0.85)';
      ctx.beginPath();
      ctx.moveTo(-9,-2.5);ctx.lineTo(-16-Math.random()*7,0);ctx.lineTo(-9,2.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle='rgba(95,168,255,0.07)';
    ctx.lineWidth=1;
    const gw=86;
    const off=(-G.camX*0.5%gw+gw)%gw;
    ctx.beginPath();
    for(let x=off;x<viewW;x+=gw){ctx.moveTo(x,0);ctx.lineTo(x,viewH);}
    for(let y=0;y<viewH;y+=gw){ctx.moveTo(0,y);ctx.lineTo(viewW,y);}
    ctx.stroke();
  } else {
    /* dead moon + bats + manors + tombstones + lanterns + fog */
    const moonX=viewW*0.78,moonY=viewH*0.18;
    const mg=ctx.createRadialGradient(moonX,moonY,8,moonX,moonY,90);
    mg.addColorStop(0,'rgba(235,225,255,0.95)');
    mg.addColorStop(0.35,'rgba(190,160,255,0.35)');
    mg.addColorStop(1,'rgba(190,160,255,0)');
    ctx.fillStyle=mg;
    ctx.fillRect(moonX-95,moonY-95,190,190);
    /* bats crossing the moon */
    const btCyc=Math.floor(G.gameTime/7);
    const btK=(G.gameTime%7)/3.2;
    if(btK<1){
      for(let b=0;b<3;b++){
        const bx=moonX-150+btK*300+b*26;
        const by=moonY-22+Math.sin(G.gameTime*3+b)*14+b*12;
        const flap=Math.sin(G.gameTime*18+b*2)*4;
        ctx.strokeStyle='rgba(15,8,25,0.85)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(bx-6,by-flap);
        ctx.quadraticCurveTo(bx-3,by+2,bx,by);
        ctx.quadraticCurveTo(bx+3,by+2,bx+6,by-flap);
        ctx.stroke();
      }
    }
    ctx.fillStyle='rgba(12,8,20,0.9)';
    for(let i=0;i<4;i++){
      const bx=((i*viewW*0.42-G.camX*0.3)%(viewW*1.7)+viewW*1.7)%(viewW*1.7)-viewW*0.35;
      const bw=90+hash01(i*3.3)*120,bh=viewH*(0.2+hash01(i*8.8)*0.16);
      ctx.fillRect(bx,viewH-bh,bw,bh);
      ctx.beginPath();
      ctx.moveTo(bx-12,viewH-bh);
      ctx.lineTo(bx+bw*0.5,viewH-bh-46);
      ctx.lineTo(bx+bw+12,viewH-bh);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='rgba(255,220,130,0.14)';
      ctx.fillRect(bx+bw*0.3,viewH-bh*0.7,14,18);
      ctx.fillStyle='rgba(12,8,20,0.9)';
    }
    /* graveyard row: tombstones + flickering lanterns */
    for(let i=0;i<7;i++){
      const tx=((i*viewW*0.23-G.camX*0.5)%(viewW*1.5)+viewW*1.5)%(viewW*1.5)-viewW*0.25;
      const ty=viewH*0.86;
      if(hash01(i*4.9)<0.7){
        const tw2=14+hash01(i*8.3)*10,th=20+hash01(i*2.7)*14;
        ctx.fillStyle='rgba(34,26,52,0.95)';
        roundRectPath(ctx,tx,ty-th,tw2,th,tw2*0.45);
        ctx.fill();
        ctx.fillRect(tx,ty-th*0.4,tw2,th*0.4);
        ctx.strokeStyle='rgba(110,90,150,0.5)';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(tx+tw2/2,ty-th*0.78);
        ctx.lineTo(tx+tw2/2,ty-th*0.42);
        ctx.moveTo(tx+tw2*0.28,ty-th*0.64);
        ctx.lineTo(tx+tw2*0.72,ty-th*0.64);
        ctx.stroke();
      }else{
        /* lantern post */
        const flick=0.5+0.4*Math.abs(Math.sin(G.gameTime*7+i*2.4));
        ctx.strokeStyle='rgba(30,22,46,0.95)';
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(tx,ty);
        ctx.lineTo(tx,ty-44);
        ctx.lineTo(tx+12,ty-44);
        ctx.stroke();
        const lg=ctx.createRadialGradient(tx+12,ty-38,1,tx+12,ty-38,16);
        lg.addColorStop(0,'rgba(255,214,130,'+(0.85*flick).toFixed(2)+')');
        lg.addColorStop(1,'rgba(255,180,90,0)');
        ctx.fillStyle=lg;
        ctx.fillRect(tx-6,ty-56,38,38);
        ctx.fillStyle='rgba(255,226,150,'+flick.toFixed(2)+')';
        ctx.fillRect(tx+9.5,ty-42,5,7);
      }
    }
    for(let i=0;i<3;i++){
      const fy=viewH*(0.55+i*0.14);
      const fx=((G.gameTime*(12+i*7)+i*340)%(viewW+460))-230;
      const fg=ctx.createRadialGradient(fx,fy,10,fx,fy,150);
      fg.addColorStop(0,'rgba(160,140,210,0.10)');
      fg.addColorStop(1,'rgba(160,140,210,0)');
      ctx.fillStyle=fg;
      ctx.fillRect(fx-150,fy-60,300,120);
    }
  }
}

/* ---------------- WORLD GEOMETRY ---------------- */
function drawGeometry(){
  const pal=envPal(),g=G.cfg.genre;
  if(g===0){
    /* themed pit bottoms: lava glow / void / phantom mist */
    const env=G.cfg.env;
    for(const pit of G.pits){
      if(pit.x2<G.camX-40||pit.x1>G.camX+viewW+40)continue;
      const pg=ctx.createLinearGradient(0,G.groundY,0,viewH+40);
      if(env===0){
        const flick=0.42+0.14*Math.sin(G.gameTime*3+pit.x1);
        pg.addColorStop(0,'rgba(40,6,2,0)');
        pg.addColorStop(1,'rgba(255,90,20,'+flick.toFixed(2)+')');
      }else if(env===1){
        pg.addColorStop(0,'rgba(2,3,12,0)');
        pg.addColorStop(1,'rgba(1,2,10,0.95)');
      }else{
        const flick=0.34+0.1*Math.sin(G.gameTime*2.2+pit.x1);
        pg.addColorStop(0,'rgba(40,20,70,0)');
        pg.addColorStop(1,'rgba(125,75,205,'+flick.toFixed(2)+')');
      }
      ctx.fillStyle=pg;
      ctx.fillRect(pit.x1,G.groundY+4,pit.x2-pit.x1,viewH-G.groundY+60);
    }
    /* solid terrain: ground segments, stairs, walls, tunnel slabs */
    for(const s of solids){
      if(s.x+s.w<G.camX-40||s.x>G.camX+viewW+40)continue;
      ctx.fillStyle=pal.ground;
      ctx.fillRect(s.x,s.y,s.w,s.h);
      ctx.save();
      ctx.shadowColor=pal.edge;
      ctx.shadowBlur=8;
      ctx.strokeStyle=pal.edge;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(s.x,s.y+1);
      ctx.lineTo(s.x+s.w,s.y+1);
      ctx.stroke();
      if(s.y+s.h<G.groundY+4){
        /* hovering slab (tunnel ceiling): glow its underside too */
        ctx.beginPath();
        ctx.moveTo(s.x,s.y+s.h-1);
        ctx.lineTo(s.x+s.w,s.y+s.h-1);
        ctx.stroke();
      }
      ctx.restore();
    }
    /* one-way floating ledges */
    for(const p of platforms){
      if(p.x+p.w<G.camX-40||p.x>G.camX+viewW+40)continue;
      ctx.fillStyle=pal.plat;
      roundRectPath(ctx,p.x,p.y,p.w,p.h,6);
      ctx.fill();
      ctx.save();
      ctx.shadowColor=pal.edge;
      ctx.shadowBlur=8;
      ctx.strokeStyle=pal.edge;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y+1);
      ctx.lineTo(p.x+p.w,p.y+1);
      ctx.stroke();
      ctx.restore();
    }
    if(G.portal){
      const pt=G.portal;
      const pcx=pt.x+pt.w/2,pcy=pt.y+pt.h/2;
      /* light beam column so the exit reads from across the level */
      const beamA=0.1+0.05*Math.sin(G.gameTime*2.2);
      const bg2=ctx.createLinearGradient(0,0,0,pt.y);
      bg2.addColorStop(0,'rgba(125,255,168,0)');
      bg2.addColorStop(1,'rgba(125,255,168,'+beamA.toFixed(3)+')');
      ctx.fillStyle=bg2;
      ctx.fillRect(pt.x-8,0,pt.w+16,pt.y+6);
      ctx.save();
      ctx.shadowColor='#7dffa8';
      ctx.shadowBlur=24;
      const pg=ctx.createRadialGradient(pcx,pcy,4,pcx,pcy,pt.h/2);
      pg.addColorStop(0,'rgba(220,255,235,0.95)');
      pg.addColorStop(0.5,'rgba(125,255,168,0.55)');
      pg.addColorStop(1,'rgba(125,255,168,0.05)');
      ctx.fillStyle=pg;
      ctx.beginPath();
      ctx.ellipse(pcx,pcy,pt.w/2,pt.h/2,0,0,TAU);
      ctx.fill();
      ctx.strokeStyle='#7dffa8';
      ctx.lineWidth=3;
      for(let k=0;k<2;k++){
        ctx.beginPath();
        ctx.ellipse(pcx,pcy,pt.w/2+4,pt.h/2+4,0,
          G.gameTime*2.4+k*Math.PI,G.gameTime*2.4+k*Math.PI+1.5);
        ctx.stroke();
      }
      ctx.fillStyle='#7dffa8';
      ctx.font='bold 13px "Courier New", monospace';
      ctx.textAlign='center';
      ctx.fillText('EXIT',pcx,pt.y-12);
      ctx.restore();
    }
  } else {
    ctx.strokeStyle=pal.line;
    ctx.globalAlpha=0.08;
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<viewW;x+=60){ctx.moveTo(x,0);ctx.lineTo(x,viewH);}
    for(let y=0;y<viewH;y+=60){ctx.moveTo(0,y);ctx.lineTo(viewW,y);}
    ctx.stroke();
    ctx.globalAlpha=1;
    ctx.save();
    ctx.shadowColor=pal.edge;
    ctx.shadowBlur=12;
    for(const w of walls){
      ctx.fillStyle=pal.plat;
      ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.strokeStyle=pal.edge;
      ctx.lineWidth=2;
      ctx.strokeRect(w.x,w.y,w.w,w.h);
    }
    ctx.restore();
  }
}
function drawTelegraphs(){
  for(const tg of telegraphs){
    const k=1-tg.t/0.75;
    ctx.save();
    ctx.strokeStyle='rgba(255,107,107,'+(0.35+0.5*Math.abs(Math.sin(G.gameTime*14))).toFixed(2)+')';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(tg.x+17,tg.y+18,26*(1-k*0.5),0,TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(tg.x+17,tg.y+18,8,0,TAU);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- HAZARD RENDERING ---------------- */
function drawHazards(){
  for(const hz of hazards){
    if(hz.dead)continue;
    if(hz.kind==='awarn'){
      /* incoming asteroid indicator: pulsing chevron at the entry edge */
      const wx=G.cfg.genre===1?hz.rx:G.camX+hz.rx;
      const wy=hz.ry;
      const ix=clamp(wx,G.camX+26,G.camX+viewW-26);
      const iy=clamp(wy,72,viewH-30);
      const ang=Math.atan2(player.y+player.h/2-iy,player.x+player.w/2-ix);
      const pulse=0.45+0.5*Math.abs(Math.sin(G.gameTime*14));
      ctx.save();
      ctx.translate(ix,iy);
      ctx.globalAlpha=pulse;
      ctx.shadowColor='#ff7a3c';
      ctx.shadowBlur=12;
      ctx.strokeStyle='#ffd9b8';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(0,0,17,0,TAU);
      ctx.stroke();
      ctx.rotate(ang);
      ctx.fillStyle='#ff9c54';
      ctx.beginPath();
      ctx.moveTo(13,0);
      ctx.lineTo(-7,-8);
      ctx.lineTo(-7,8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if(hz.kind==='geyser'){
      if(hz.t<hz.warn){
        const a=0.3+0.5*Math.abs(Math.sin(G.gameTime*16));
        ctx.fillStyle='rgba(255,122,60,'+a.toFixed(2)+')';
        ctx.beginPath();
        ctx.ellipse(hz.x,G.groundY,26,7,0,0,TAU);
        ctx.fill();
      }else{
        const k=(hz.t-hz.warn)/hz.live;
        const h=hz.hgt*Math.min(1,k*4)*(1-Math.max(0,k-0.75)*4*0.4);
        const lg=ctx.createLinearGradient(0,G.groundY-h,0,G.groundY);
        lg.addColorStop(0,'rgba(255,230,150,0.95)');
        lg.addColorStop(0.5,'rgba(255,120,30,0.92)');
        lg.addColorStop(1,'rgba(200,40,10,0.9)');
        ctx.save();
        ctx.shadowColor='#ff7a3c';
        ctx.shadowBlur=22;
        ctx.fillStyle=lg;
        roundRectPath(ctx,hz.x-hz.w/2,G.groundY-h,hz.w,h,10);
        ctx.fill();
        ctx.restore();
      }
    } else if(hz.kind==='pool'){
      if(hz.t<hz.warn){
        const a=0.3+0.5*Math.abs(Math.sin(G.gameTime*16));
        ctx.strokeStyle='rgba(255,122,60,'+a.toFixed(2)+')';
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.arc(hz.x,hz.y,hz.r,0,TAU);
        ctx.stroke();
      }else{
        ctx.save();
        ctx.shadowColor='#ff7a3c';
        ctx.shadowBlur=20;
        const pg=ctx.createRadialGradient(hz.x,hz.y,4,hz.x,hz.y,hz.r);
        pg.addColorStop(0,'rgba(255,230,150,0.95)');
        pg.addColorStop(0.6,'rgba(255,110,30,0.9)');
        pg.addColorStop(1,'rgba(160,30,5,0.85)');
        ctx.fillStyle=pg;
        ctx.beginPath();
        ctx.arc(hz.x,hz.y,hz.r,0,TAU);
        ctx.fill();
        ctx.strokeStyle='rgba(255,210,120,0.7)';
        ctx.lineWidth=2;
        for(let b=0;b<3;b++){
          const ba=G.gameTime*3+b*2.1;
          ctx.beginPath();
          ctx.arc(hz.x+Math.cos(ba)*hz.r*0.5,hz.y+Math.sin(ba)*hz.r*0.5,4+Math.sin(G.gameTime*7+b)*2,0,TAU);
          ctx.stroke();
        }
        ctx.restore();
      }
    } else if(hz.kind==='asteroid'){
      ctx.save();
      ctx.translate(hz.x,hz.y);
      ctx.rotate(hz.rot);
      ctx.shadowColor='#9aa1ad';
      ctx.shadowBlur=8;
      ctx.fillStyle='#6b6f7a';
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=i/8*TAU;
        const rr=hz.r*hz.verts[i];
        if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
        else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='#9aa1ad';
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.fillStyle='rgba(40,44,54,0.8)';
      ctx.beginPath();
      ctx.arc(-hz.r*0.3,-hz.r*0.15,hz.r*0.22,0,TAU);
      ctx.arc(hz.r*0.25,hz.r*0.3,hz.r*0.16,0,TAU);
      ctx.fill();
      ctx.restore();
    } else if(hz.kind==='phantom'){
      ctx.save();
      ctx.globalAlpha=hz.alpha*0.85;
      ctx.shadowColor='#b98bff';
      ctx.shadowBlur=18;
      const pg=ctx.createRadialGradient(hz.x,hz.y,2,hz.x,hz.y,hz.r*1.4);
      pg.addColorStop(0,'rgba(240,232,255,0.95)');
      pg.addColorStop(0.6,'rgba(185,139,255,0.5)');
      pg.addColorStop(1,'rgba(185,139,255,0)');
      ctx.fillStyle=pg;
      ctx.beginPath();
      ctx.arc(hz.x,hz.y,hz.r*1.4,0,TAU);
      ctx.fill();
      ctx.fillStyle='rgba(20,8,40,0.9)';
      ctx.beginPath();
      ctx.arc(hz.x-6,hz.y-3,3.2,0,TAU);
      ctx.arc(hz.x+6,hz.y-3,3.2,0,TAU);
      ctx.fill();
      ctx.strokeStyle='rgba(220,200,255,0.5)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(hz.x-hz.r,hz.y+hz.r*0.5);
      ctx.quadraticCurveTo(hz.x,hz.y+hz.r*1.3+Math.sin(G.gameTime*6)*4,hz.x+hz.r,hz.y+hz.r*0.5);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---------------- PICKUP RENDERING ---------------- */
function drawPickups(){
  for(const pk of pickups){
    const bob=Math.sin(pk.t*3)*6;
    const px=pk.x,py=pk.y+bob;
    const pulse=0.75+0.25*Math.sin(pk.t*6);
    const fade=pk.life<2?pk.life/2:1;
    ctx.save();
    ctx.globalAlpha=fade;
    if(pk.kind===0){
      ctx.shadowColor='#7dffa8';
      ctx.shadowBlur=14*pulse;
      ctx.fillStyle='#7dffa8';
      const s=7*pulse;
      ctx.fillRect(px-s,py-s*0.38,s*2,s*0.76);
      ctx.fillRect(px-s*0.38,py-s,s*0.76,s*2);
    }else if(pk.kind===1){
      ctx.shadowColor='#5fa8ff';
      ctx.shadowBlur=14*pulse;
      ctx.strokeStyle='#5fa8ff';
      ctx.fillStyle='rgba(95,168,255,0.3)';
      ctx.lineWidth=2.5;
      hexPath(ctx,px,py,9*pulse,G.gameTime*1.5);
      ctx.fill();
      ctx.stroke();
    }else{
      ctx.shadowColor='#ffd95f';
      ctx.shadowBlur=14*pulse;
      ctx.fillStyle='#ffd95f';
      const s=10*pulse;
      ctx.beginPath();
      ctx.moveTo(px+s*0.25,py-s);
      ctx.lineTo(px-s*0.45,py+s*0.15);
      ctx.lineTo(px-s*0.02,py+s*0.15);
      ctx.lineTo(px-s*0.25,py+s);
      ctx.lineTo(px+s*0.45,py-s*0.15);
      ctx.lineTo(px+s*0.02,py-s*0.15);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------------- ENEMY RENDERING ---------------- */
function drawRootAttack(en){
  /* buried plant: slithering root bulge + locked eruption mound */
  const dc=dirtColors();
  const onPop=en.rootState==='pop';
  const tx=onPop?en.lockX:en.tipX;
  const ty=onPop?en.lockY:en.tipY;
  ctx.save();
  if(G.cfg.genre===0){
    /* wavy root line trailing behind the bulge */
    ctx.strokeStyle='rgba('+dc[0][0]+','+dc[0][1]+','+dc[0][2]+',0.75)';
    ctx.lineWidth=4;
    ctx.beginPath();
    for(let k=0;k<=6;k++){
      const lx=tx-k*13*(en.tipX<player.x?1:-1);
      const ly=G.groundY-Math.abs(Math.sin(k*1.3+G.gameTime*9))*5;
      if(k===0)ctx.moveTo(lx,ly);else ctx.lineTo(lx,ly);
    }
    ctx.stroke();
  }
  const pulse=onPop?(1+Math.sin(G.gameTime*22)*0.25):1;
  const mr=(onPop?14:9)*pulse;
  const mg2=ctx.createRadialGradient(tx,ty,1,tx,ty,mr+6);
  mg2.addColorStop(0,'rgba('+dc[1][0]+','+dc[1][1]+','+dc[1][2]+',0.85)');
  mg2.addColorStop(1,'rgba('+dc[0][0]+','+dc[0][1]+','+dc[0][2]+',0)');
  ctx.fillStyle=mg2;
  ctx.beginPath();
  if(G.cfg.genre===0)ctx.ellipse(tx,ty,mr+6,(mr+6)*0.45,0,Math.PI,0);
  else ctx.arc(tx,ty,mr+6,0,TAU);
  ctx.fill();
  ctx.fillStyle='rgba('+dc[0][0]+','+dc[0][1]+','+dc[0][2]+',0.9)';
  ctx.beginPath();
  if(G.cfg.genre===0)ctx.ellipse(tx,ty,mr,mr*0.42,0,Math.PI,0);
  else ctx.arc(tx,ty,mr*0.7,0,TAU);
  ctx.fill();
  if(onPop){
    /* crack lines radiating out during the telegraph */
    ctx.strokeStyle='rgba('+dc[1][0]+','+dc[1][1]+','+dc[1][2]+',0.8)';
    ctx.lineWidth=1.6;
    ctx.beginPath();
    for(let k=0;k<4;k++){
      const ca=(G.cfg.genre===0?Math.PI:0)+k*1.05+0.4;
      ctx.moveTo(tx,ty);
      ctx.lineTo(tx+Math.cos(ca)*(mr+10),ty-Math.abs(Math.sin(ca))*(mr*0.8+6)*(G.cfg.genre===0?1:-Math.sign(Math.sin(ca))||1));
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawEnemies(){
  for(const en of enemies){
    if(en.dead)continue;
    if(isBuried(en)){drawRootAttack(en);continue;}
    const ecx=en.x+en.w/2,ecy=en.y+en.h/2;
    /* ghost afterimage trail */
    if(en.type===0&&en.trail.length){
      ctx.save();
      ctx.shadowColor='#bfeaff';
      ctx.shadowBlur=8;
      for(const tr of en.trail){
        if(tr.a<=0)continue;
        ctx.globalAlpha=tr.a;
        ctx.fillStyle='rgba(200,235,255,0.7)';
        ctx.beginPath();
        ctx.arc(tr.x+en.w/2,tr.y+en.h/2-3,en.w*0.34,0,TAU);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.save();
    /* squash & stretch punch on hit */
    if(en.hitT>0){
      const k=en.hitT/0.15;
      ctx.translate(ecx,ecy);
      ctx.scale(1+0.28*k,1-0.22*k);
      ctx.translate(-ecx,-ecy);
    }
    if(en.type===0){
      ctx.globalAlpha=0.55+0.28*Math.sin(en.t*4);
      ctx.shadowColor='#bfeaff';
      ctx.shadowBlur=16;
      ctx.fillStyle='rgba(200,235,255,0.85)';
      ctx.beginPath();
      ctx.arc(ecx,ecy-3,en.w*0.46,Math.PI,0);
      const seg=en.w*0.92/3;
      for(let i=0;i<3;i++){
        ctx.arc(ecx+en.w*0.46-seg*(i+0.5),en.y+en.h-6,seg/2,0,Math.PI);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='rgba(15,35,70,0.95)';
      ctx.beginPath();
      ctx.arc(ecx-6,ecy-6,3.4,0,TAU);
      ctx.arc(ecx+6,ecy-6,3.4,0,TAU);
      ctx.fill();
    }else if(en.type===1){
      ctx.shadowColor='#ff6b6b';
      ctx.shadowBlur=8;
      const mg=ctx.createLinearGradient(en.x,en.y,en.x,en.y+en.h);
      mg.addColorStop(0,'#8a93a5');
      mg.addColorStop(1,'#3c4250');
      ctx.fillStyle=mg;
      roundRectPath(ctx,en.x,en.y+6,en.w,en.h-12,5);
      ctx.fill();
      ctx.fillStyle='#20242e';
      ctx.fillRect(en.x+3,en.y+en.h-7,en.w-6,7);
      ctx.fillStyle='#13161d';
      ctx.fillRect(en.x+4,en.y+12,en.w-8,9);
      const scan=ecx+Math.sin(en.t*5)*(en.w*0.26);
      ctx.fillStyle='#ff4040';
      ctx.shadowBlur=12;
      ctx.fillRect(scan-3,en.y+13.5,6,6);
      ctx.shadowBlur=0;
      ctx.strokeStyle='#aab3c5';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(ecx,en.y+6);
      ctx.lineTo(ecx,en.y-4);
      ctx.stroke();
      ctx.fillStyle='#ff6b6b';
      ctx.beginPath();
      ctx.arc(ecx,en.y-6,2.6,0,TAU);
      ctx.fill();
    }else{
      ctx.shadowColor='#7dffa8';
      ctx.shadowBlur=10;
      ctx.fillStyle='#1d4d2c';
      ctx.beginPath();
      ctx.ellipse(ecx,en.y+en.h-5,en.w*0.5,7,0,0,TAU);
      ctx.fill();
      ctx.strokeStyle='#2f7a44';
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(ecx,en.y+en.h-8);
      ctx.quadraticCurveTo(ecx+Math.sin(en.t*3)*5,ecy,ecx,en.y+12);
      ctx.stroke();
      for(let i=0;i<5;i++){
        const pa=i/5*TAU+en.t*0.8;
        ctx.fillStyle='#48b865';
        ctx.beginPath();
        ctx.ellipse(ecx+Math.cos(pa)*12,en.y+10+Math.sin(pa)*12,7,3.6,pa,0,TAU);
        ctx.fill();
      }
      const jaw=3+Math.abs(Math.sin(en.t*4))*5;
      ctx.fillStyle='#7dffa8';
      ctx.beginPath();
      ctx.arc(ecx,en.y+10,9,0,TAU);
      ctx.fill();
      ctx.fillStyle='#0c2614';
      ctx.beginPath();
      ctx.ellipse(ecx,en.y+12,5,jaw*0.45,0,0,TAU);
      ctx.fill();
    }
    if(en.flashT>0){
      ctx.globalAlpha=Math.min(1,en.flashT*9);
      ctx.fillStyle='#ffffff';
      roundRectPath(ctx,en.x,en.y,en.w,en.h,6);
      ctx.fill();
    }
    ctx.restore();
    if(en.hp<en.maxHp){
      const bw=en.w,frac=clamp(en.hp/en.maxHp,0,1);
      ctx.fillStyle='rgba(10,12,20,0.7)';
      ctx.fillRect(en.x,en.y-9,bw,4);
      ctx.fillStyle=frac>0.5?'#7dffa8':(frac>0.25?'#ffd95f':'#ff6b6b');
      ctx.fillRect(en.x,en.y-9,bw*frac,4);
    }
  }
}

/* ---------------- PLAYER RENDERING ---------------- */
function drawPlayer(){
  if(player.invulnT>0&&player.shieldUltT<=0&&Math.floor(G.gameTime*18)%2===0)return;
  const px=player.x,py=player.y,pw=player.w,ph=player.h;
  const pcx=px+pw/2,pcy=py+ph/2;
  const f=player.facing,h=G.cfg.hero;
  ctx.save();
  /* squash on landing, stretch while leaping */
  if(G.cfg.genre===0){
    let sx=1,sy=1;
    if(player.landT>0){
      const k=player.landT/0.14;
      sx=1+0.22*k;sy=1-0.2*k;
    }else if(!player.onGround&&player.vy<-180){
      sx=0.92;sy=1.1;
    }
    if(sx!==1||sy!==1){
      ctx.translate(pcx,py+ph);
      ctx.scale(sx,sy);
      ctx.translate(-pcx,-(py+ph));
    }
  }
  if(player.overdriveT>0){
    ctx.shadowColor='#ffb347';
    ctx.shadowBlur=22;
    /* pulsing heat ring of the fire aura */
    const hr=Math.max(pw,ph)*0.78+Math.sin(G.gameTime*9)*4;
    ctx.strokeStyle='rgba(255,150,50,'+(0.3+0.18*Math.sin(G.gameTime*11)).toFixed(2)+')';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(pcx,pcy,hr,0,TAU);
    ctx.stroke();
  }
  if(h===0){
    /* PLASMA MECH */
    ctx.shadowColor=player.overdriveT>0?'#ffb347':'#41d9ff';
    ctx.shadowBlur=14;
    const bg=ctx.createLinearGradient(px,py,px,py+ph);
    bg.addColorStop(0,'#5a6c8c');
    bg.addColorStop(1,'#2a3450');
    ctx.fillStyle=bg;
    roundRectPath(ctx,px,py+4,pw,ph-12,6);
    ctx.fill();
    ctx.fillStyle='#1b2236';
    ctx.fillRect(px+3,py+ph-9,pw*0.38,9);
    ctx.fillRect(px+pw-3-pw*0.38,py+ph-9,pw*0.38,9);
    ctx.fillStyle='#0a0f1e';
    ctx.fillRect(px+3,py+9,pw-6,8);
    ctx.fillStyle='#41d9ff';
    ctx.shadowBlur=16;
    ctx.fillRect(pcx+f*3-5,py+10.5,10,5);
    ctx.shadowBlur=0;
    ctx.fillStyle='#41d9ff';
    ctx.fillRect(pcx+f*(pw*0.5)-(f>0?0:8),pcy-2,8,5);
  }else if(h===1){
    /* CYBER CAT */
    ctx.shadowColor=player.overdriveT>0?'#ffb347':'#ff5fd2';
    ctx.shadowBlur=14;
    const bg=ctx.createLinearGradient(px,py,px,py+ph);
    bg.addColorStop(0,'#e44fbf');
    bg.addColorStop(1,'#7a1f66');
    ctx.fillStyle=bg;
    roundRectPath(ctx,px,py+8,pw,ph-8,9);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px+4,py+10);
    ctx.lineTo(px+8,py-2);
    ctx.lineTo(px+13,py+9);
    ctx.moveTo(px+pw-4,py+10);
    ctx.lineTo(px+pw-8,py-2);
    ctx.lineTo(px+pw-13,py+9);
    ctx.fill();
    ctx.strokeStyle='#ff5fd2';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(pcx-f*pw*0.5,pcy+6);
    ctx.quadraticCurveTo(pcx-f*pw*1.05,pcy+2+Math.sin(G.gameTime*6)*5,pcx-f*pw*0.85,pcy-12);
    ctx.stroke();
    ctx.fillStyle='#7dffa8';
    ctx.shadowColor='#7dffa8';
    ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.arc(pcx+f*4-4,py+17,2.6,0,TAU);
    ctx.arc(pcx+f*4+4,py+17,2.6,0,TAU);
    ctx.fill();
  }else{
    /* WIZARD HERO */
    ctx.shadowColor=player.overdriveT>0?'#ffb347':'#b98bff';
    ctx.shadowBlur=14;
    const bg=ctx.createLinearGradient(px,py,px,py+ph);
    bg.addColorStop(0,'#8f6ad6');
    bg.addColorStop(1,'#3c2470');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(pcx,py+10);
    ctx.lineTo(px+pw+3,py+ph);
    ctx.lineTo(px-3,py+ph);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#2a1850';
    ctx.beginPath();
    ctx.moveTo(pcx,py-8);
    ctx.lineTo(pcx+12,py+12);
    ctx.lineTo(pcx-12,py+12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#ffe2a8';
    ctx.beginPath();
    ctx.arc(pcx,py+16,5,0,TAU);
    ctx.fill();
    ctx.strokeStyle='#6e4ad0';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(pcx+f*pw*0.62,py+6);
    ctx.lineTo(pcx+f*pw*0.62,py+ph);
    ctx.stroke();
    ctx.fillStyle='#b98bff';
    ctx.shadowColor='#b98bff';
    ctx.shadowBlur=16;
    ctx.beginPath();
    ctx.arc(pcx+f*pw*0.62,py+4,4.4,0,TAU);
    ctx.fill();
  }
  ctx.restore();
  if(player.shieldUltT>0){
    ctx.save();
    ctx.shadowColor='#5fa8ff';
    ctx.shadowBlur=20;
    ctx.strokeStyle='rgba(120,190,255,'+(0.55+0.35*Math.sin(G.gameTime*9)).toFixed(2)+')';
    ctx.lineWidth=3;
    hexPath(ctx,pcx,pcy,Math.max(pw,ph)*0.85,G.gameTime*2.6);
    ctx.stroke();
    ctx.strokeStyle='rgba(180,225,255,0.3)';
    hexPath(ctx,pcx,pcy,Math.max(pw,ph)*0.85+6,-G.gameTime*1.8);
    ctx.stroke();
    ctx.restore();
  }
  if(player.shieldHitT>0){
    /* shield ripple: expanding hex shimmer where the hit was absorbed */
    const k=1-player.shieldHitT/0.35;
    ctx.save();
    ctx.globalAlpha=(1-k)*0.8;
    ctx.shadowColor='#5fa8ff';
    ctx.shadowBlur=12;
    ctx.strokeStyle='#9cd0ff';
    ctx.lineWidth=2.5-k*1.5;
    hexPath(ctx,pcx,pcy,Math.max(pw,ph)*(0.6+k*0.9),G.gameTime*3);
    ctx.stroke();
    ctx.restore();
  }
}
function drawWisps(){
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  for(const w of wisps){
    const wx=pcx+Math.cos(w.ang)*46,wy=pcy+Math.sin(w.ang)*46;
    ctx.save();
    ctx.shadowColor='#dcb4ff';
    ctx.shadowBlur=14;
    const wg=ctx.createRadialGradient(wx,wy,1,wx,wy,9);
    wg.addColorStop(0,'rgba(255,250,255,0.95)');
    wg.addColorStop(1,'rgba(185,139,255,0.15)');
    ctx.fillStyle=wg;
    ctx.beginPath();
    ctx.arc(wx,wy,9,0,TAU);
    ctx.fill();
    ctx.globalAlpha=0.4;
    ctx.strokeStyle='#b98bff';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(pcx,pcy,46,w.ang-0.6,w.ang);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- PROJECTILE RENDERING ---------------- */
function drawProjectiles(){
  for(const p of projs){
    ctx.save();
    if(p.kind==='beam'){
      const a=clamp(p.life/p.maxLife,0,1);
      const x2=p.x+p.ax*p.len,y2=p.y+p.ay*p.len;
      ctx.globalAlpha=a;
      ctx.shadowColor='#41d9ff';
      ctx.shadowBlur=18;
      ctx.lineCap='round';
      ctx.strokeStyle='rgba(105,220,255,0.85)';
      ctx.lineWidth=7*a+1.5;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(x2,y2);
      ctx.stroke();
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=2.4*a+0.6;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(x2,y2);
      ctx.stroke();
      ctx.fillStyle='#e6fbff';
      ctx.beginPath();
      ctx.arc(p.x,p.y,4*a+1,0,TAU);
      ctx.fill();
    }else if(p.kind==='slash'){
      /* crescent grows then HARD-STOPS exactly at the true hit radius */
      const prog=p.t/p.life;
      const grow=Math.min(1,prog/0.6);
      const rad=(p.range-3)*(0.55+0.45*grow);
      ctx.translate(p.x,p.y);
      ctx.rotate(Math.atan2(p.ay,p.ax));
      ctx.globalAlpha=1-prog;
      ctx.shadowColor='#9dffce';
      ctx.shadowBlur=6;
      ctx.strokeStyle='#c8ffe6';
      ctx.lineWidth=6;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.arc(0,0,rad,-1.2,1.2);
      ctx.stroke();
      ctx.strokeStyle='#ff5fd2';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,0,rad-7,-1.0,1.0);
      ctx.stroke();
    }else if(p.kind==='fire'){
      ctx.shadowColor='#ff8030';
      ctx.shadowBlur=16;
      const fg=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.r+3);
      fg.addColorStop(0,'#fff3c0');
      fg.addColorStop(0.55,'#ffae3c');
      fg.addColorStop(1,'rgba(255,60,10,0.25)');
      ctx.fillStyle=fg;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r+3,0,TAU);
      ctx.fill();
    }else if(p.kind==='yarn'){
      ctx.shadowColor='#ff5fd2';
      ctx.shadowBlur=14;
      ctx.fillStyle='#ff8bdd';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,TAU);
      ctx.fill();
      ctx.strokeStyle='#c22a92';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*0.62,p.spin,p.spin+4.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*0.3,-p.spin,-p.spin+4.4);
      ctx.stroke();
    }else if(p.kind==='rocket'){
      ctx.translate(p.x,p.y);
      ctx.rotate(Math.atan2(p.vy,p.vx));
      ctx.shadowColor='#ffb347';
      ctx.shadowBlur=10;
      ctx.fillStyle='#d8dde8';
      ctx.beginPath();
      ctx.moveTo(8,0);
      ctx.lineTo(-6,-4.5);
      ctx.lineTo(-6,4.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='#ffb347';
      ctx.beginPath();
      ctx.moveTo(-6,-3);
      ctx.lineTo(-12-Math.random()*5,0);
      ctx.lineTo(-6,3);
      ctx.closePath();
      ctx.fill();
    }else if(p.kind==='bead'){
      ctx.shadowColor='#ffe27d';
      ctx.shadowBlur=8;
      ctx.fillStyle='#fff3b0';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}
function drawEnemyProjectiles(){
  for(const p of eprojs){
    ctx.save();
    if(p.kind==='laser'){
      ctx.shadowColor='#ff4040';
      ctx.shadowBlur=10;
      const sp=Math.hypot(p.vx,p.vy)||1;
      ctx.strokeStyle='#ff7a6a';
      ctx.lineWidth=3.6;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(p.x-p.vx/sp*11,p.y-p.vy/sp*11);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    }else{
      ctx.shadowColor='#7dffa8';
      ctx.shadowBlur=8;
      ctx.fillStyle='#9af0b4';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,TAU);
      ctx.fill();
      ctx.fillStyle='#1d5e30';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*0.45,0,TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}
function drawParticles(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    if(!p.active)continue;
    const k=1-p.life/p.maxLife;
    const r=Math.round(p.r0+(p.r1-p.r0)*k);
    const gg=Math.round(p.g0+(p.g1-p.g0)*k);
    const b=Math.round(p.b0+(p.b1-p.b0)*k);
    const a=(p.life/p.maxLife);
    ctx.fillStyle='rgba('+r+','+gg+','+b+','+a.toFixed(3)+')';
    const s=p.size*(0.5+0.5*a);
    ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
  }
  ctx.restore();
}

/* ---------------- SHOCKWAVE RINGS ---------------- */
function drawShockwaves(){
  for(const sw of shockwaves){
    const k=sw.t/sw.life;
    const ease=1-(1-k)*(1-k);
    ctx.save();
    ctx.globalAlpha=(1-k)*0.85;
    ctx.strokeStyle=sw.color;
    ctx.shadowColor=sw.color;
    ctx.shadowBlur=10;
    ctx.lineWidth=4.5-k*3.5;
    ctx.beginPath();
    ctx.arc(sw.x,sw.y,sw.maxR*ease,0,TAU);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- OVERDRIVE SPEED LINES ---------------- */
function drawSpeedLines(){
  if(player.overdriveT<=0||player.dead)return;
  ctx.save();
  ctx.lineCap='round';
  for(let i=0;i<10;i++){
    const sy=hash01(i*23.7)*viewH;
    const span=viewW+260;
    const sx=span-((G.gameTime*(760+hash01(i*7.7)*420)+i*257)%span)-130;
    const len=70+hash01(i*3.1)*90;
    ctx.globalAlpha=0.05+hash01(i*11.3)*0.1;
    ctx.strokeStyle=i%3===0?'#ffb347':'#ffffff';
    ctx.lineWidth=1.6+hash01(i*5.9)*1.6;
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+len,sy);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- LEVEL CLEAR FLASH ---------------- */
function drawLevelFlash(){
  if(G.levelFlashT<=0)return;
  const a=clamp(G.levelFlashT/0.5,0,1)*0.55;
  ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
  ctx.fillRect(0,0,viewW,viewH);
}

/* ---------------- FLOATING DAMAGE NUMBERS ---------------- */
function drawDmgTexts(){
  for(const d of dmgTexts){
    const a=clamp(1-d.t/d.life,0,1);
    const pop=1+0.5*Math.max(0,1-d.t*7);
    const size=(d.val>=25?15:12)*pop;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.font='bold '+size.toFixed(1)+'px "Courier New", monospace';
    ctx.textAlign='center';
    ctx.lineWidth=3;
    ctx.strokeStyle='rgba(5,6,15,0.85)';
    ctx.strokeText(String(d.val),d.x,d.y);
    ctx.fillStyle=d.val>=25?'#ffd95f':'#ffffff';
    ctx.fillText(String(d.val),d.x,d.y);
    ctx.restore();
  }
}

/* ---------------- TIME STOP OVERLAY (GPU-cheap inversion) ---------------- */
function drawTimeStopOverlay(){
  ctx.save();
  ctx.globalCompositeOperation='difference';
  const inten=Math.round(205+Math.sin(G.gameTime*18)*22);
  ctx.fillStyle='rgb('+inten+','+inten+','+inten+')';
  ctx.fillRect(0,0,viewW,viewH);
  ctx.restore();
  /* monochrome high-contrast grid shift marks the frozen timeline */
  ctx.save();
  ctx.globalAlpha=0.16;
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=1;
  const cell=48;
  const shift=(G.timeStopT*40)%cell;
  ctx.beginPath();
  for(let x=-cell+shift;x<viewW;x+=cell){ctx.moveTo(x,0);ctx.lineTo(x,viewH);}
  for(let y=-cell+shift;y<viewH;y+=cell){ctx.moveTo(0,y);ctx.lineTo(viewW,y);}
  ctx.stroke();
  ctx.restore();
  /* countdown ring */
  const cx=viewW/2,cy=64;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.85)';
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(cx,cy,20,-Math.PI/2,-Math.PI/2+TAU*(G.timeStopT/4));
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='bold 13px "Courier New", monospace';
  ctx.textAlign='center';
  ctx.fillText('TIME STOP',cx,cy+44);
  ctx.restore();
}

/* ---------------- HUD ---------------- */
function drawBar(x,y,w,h,frac,color,label){
  ctx.fillStyle='rgba(8,10,18,0.72)';
  roundRectPath(ctx,x,y,w,h,4);
  ctx.fill();
  if(frac>0){
    ctx.fillStyle=color;
    roundRectPath(ctx,x+1.5,y+1.5,(w-3)*clamp(frac,0,1),h-3,3);
    ctx.fill();
  }
  ctx.strokeStyle='rgba(232,246,255,0.25)';
  ctx.lineWidth=1;
  roundRectPath(ctx,x,y,w,h,4);
  ctx.stroke();
  ctx.fillStyle='rgba(232,246,255,0.85)';
  ctx.font='bold 10px "Courier New", monospace';
  ctx.textAlign='left';
  ctx.fillText(label,x+5,y+h-3.5);
}
function drawHUD(){
  const topY=Math.max(14,quitBtn.y-16);
  drawBar(14,topY,150,13,player.hp/player.maxHp,
    player.hp/player.maxHp>0.3?'#46d97a':'#ff5050','HP');
  drawBar(14,topY+17,110,11,player.shield/player.maxShield,'#4f9dff','SH');
  ctx.fillStyle='rgba(232,246,255,0.92)';
  ctx.font='bold 12px "Courier New", monospace';
  ctx.textAlign='left';
  ctx.fillText('LV '+G.level+'/10',14,topY+46);
  ctx.fillText('SCORE '+String(Math.floor(G.score)).padStart(6,'0'),14,topY+62);
  /* objective readout */
  let obj='';
  if(G.cfg.genre===0){
    const m=Math.max(0,Math.round((G.portal.x-player.x)/10));
    obj='PORTAL '+m+'m \u25B8';
  }else{
    obj='TARGETS '+G.kills+'/'+G.killQuota;
  }
  ctx.textAlign='right';
  ctx.font='bold 13px "Courier New", monospace';
  ctx.fillStyle='rgba(232,246,255,0.9)';
  ctx.fillText(obj,quitBtn.x-quitBtn.r-12,topY+12);
  /* quit control */
  ctx.save();
  ctx.strokeStyle='rgba(255,107,107,0.8)';
  ctx.fillStyle='rgba(20,8,12,0.55)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(quitBtn.x,quitBtn.y,quitBtn.r,0,TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle='rgba(255,140,140,0.95)';
  ctx.font='bold 16px "Courier New", monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('\u2715',quitBtn.x,quitBtn.y+1);
  ctx.restore();
  ctx.textBaseline='alphabetic';
}

/* ---------------- VIRTUAL CONTROL OVERLAY ---------------- */
function drawControls(){
  /* joystick */
  const jx=stick.active?stick.ox:stick.restX;
  const jy=stick.active?stick.oy:stick.restY;
  ctx.save();
  ctx.globalAlpha=stick.active?0.42:0.2;
  ctx.strokeStyle='#9be8ff';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(jx,jy,stick.rad,0,TAU);
  ctx.stroke();
  ctx.globalAlpha=stick.active?0.2:0.1;
  ctx.beginPath();
  ctx.moveTo(jx-stick.rad*0.55,jy);ctx.lineTo(jx+stick.rad*0.55,jy);
  ctx.moveTo(jx,jy-stick.rad*0.55);ctx.lineTo(jx,jy+stick.rad*0.55);
  ctx.stroke();
  ctx.globalAlpha=stick.active?0.78:0.3;
  const acc=heroDef().accent;
  ctx.fillStyle=acc;
  ctx.shadowColor=acc;
  ctx.shadowBlur=stick.active?16:6;
  ctx.beginPath();
  ctx.arc(jx+stick.dx,jy+stick.dy,stick.rad*0.4,0,TAU);
  ctx.fill();
  if(!stick.active){
    ctx.globalAlpha=0.45;
    ctx.shadowBlur=0;
    ctx.fillStyle='#9be8ff';
    ctx.font='bold 10px "Courier New", monospace';
    ctx.textAlign='center';
    ctx.fillText('MOVE',jx,jy+stick.rad+16);
  }
  ctx.restore();
  /* action buttons */
  for(const b of vbtns){
    ctx.save();
    let baseColor='#9be8ff',ready=true;
    if(b.key==='secondary')ready=player.secCd<=0;
    if(b.key==='ult'){
      baseColor=ULTS[G.cfg.ult].accent;
      ready=player.ult>=100;
    }
    ctx.globalAlpha=b.held?0.85:0.5;
    ctx.fillStyle='rgba(10,14,26,0.6)';
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,TAU);
    ctx.fill();
    ctx.strokeStyle=baseColor;
    ctx.lineWidth=2;
    if(b.key==='ult'&&ready){
      ctx.shadowColor=baseColor;
      ctx.shadowBlur=14+10*Math.abs(Math.sin(G.gameTime*5));
      ctx.lineWidth=3;
    }
    ctx.stroke();
    ctx.shadowBlur=0;
    /* glyphs */
    ctx.strokeStyle=ready?baseColor:'rgba(155,232,255,0.45)';
    ctx.fillStyle=ctx.strokeStyle;
    if(b.key==='primary'){
      ctx.lineWidth=2.4;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r*0.34,0,TAU);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r*0.1,0,TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(b.x-b.r*0.52,b.y);ctx.lineTo(b.x-b.r*0.2,b.y);
      ctx.moveTo(b.x+b.r*0.52,b.y);ctx.lineTo(b.x+b.r*0.2,b.y);
      ctx.moveTo(b.x,b.y-b.r*0.52);ctx.lineTo(b.x,b.y-b.r*0.2);
      ctx.moveTo(b.x,b.y+b.r*0.52);ctx.lineTo(b.x,b.y+b.r*0.2);
      ctx.stroke();
    }else if(b.key==='secondary'){
      ctx.lineWidth=3;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(b.x-b.r*0.42,b.y-b.r*0.3);
      ctx.lineTo(b.x-b.r*0.05,b.y);
      ctx.lineTo(b.x-b.r*0.42,b.y+b.r*0.3);
      ctx.moveTo(b.x+b.r*0.05,b.y-b.r*0.3);
      ctx.lineTo(b.x+b.r*0.42,b.y);
      ctx.lineTo(b.x+b.r*0.05,b.y+b.r*0.3);
      ctx.stroke();
    }else{
      const u=G.cfg.ult;
      if(u===0){
        ctx.lineWidth=2.4;
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.r*0.4,0,TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(b.x,b.y);
        ctx.lineTo(b.x,b.y-b.r*0.3);
        ctx.moveTo(b.x,b.y);
        ctx.lineTo(b.x+b.r*0.22,b.y+b.r*0.1);
        ctx.stroke();
      }else if(u===1){
        ctx.lineWidth=2.4;
        hexPath(ctx,b.x,b.y,b.r*0.42,G.gameTime*1.2);
        ctx.stroke();
      }else{
        const s=b.r*0.5;
        ctx.beginPath();
        ctx.moveTo(b.x+s*0.25,b.y-s);
        ctx.lineTo(b.x-s*0.45,b.y+s*0.15);
        ctx.lineTo(b.x-s*0.02,b.y+s*0.15);
        ctx.lineTo(b.x-s*0.25,b.y+s);
        ctx.lineTo(b.x+s*0.45,b.y-s*0.15);
        ctx.lineTo(b.x+s*0.02,b.y-s*0.15);
        ctx.closePath();
        ctx.fill();
      }
    }
    /* secondary 5s cooldown mask */
    if(b.key==='secondary'&&player.secCd>0){
      const f=clamp(player.secCd/player.secCdMax,0,1);
      ctx.globalAlpha=0.78;
      ctx.fillStyle='rgba(10,12,18,0.85)';
      ctx.beginPath();
      ctx.moveTo(b.x,b.y);
      ctx.arc(b.x,b.y,b.r-1,-Math.PI/2,-Math.PI/2+TAU*f);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle='#e8f6ff';
      ctx.font='bold 15px "Courier New", monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(String(Math.ceil(player.secCd)),b.x,b.y+1);
      ctx.textBaseline='alphabetic';
    }
    /* ultimate charge ring */
    if(b.key==='ult'){
      ctx.globalAlpha=0.9;
      ctx.strokeStyle=baseColor;
      ctx.lineWidth=3.4;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r+5,-Math.PI/2,-Math.PI/2+TAU*(player.ult/100));
      ctx.stroke();
      ctx.globalAlpha=0.85;
      ctx.fillStyle=ready?baseColor:'rgba(232,246,255,0.6)';
      ctx.font='bold 9px "Courier New", monospace';
      ctx.textAlign='center';
      ctx.fillText(ready?'READY':Math.floor(player.ult)+'%',b.x,b.y+b.r+16);
    }
    /* labels */
    ctx.globalAlpha=0.65;
    ctx.fillStyle='#9be8ff';
    ctx.font='bold 9px "Courier New", monospace';
    ctx.textAlign='center';
    if(b.key==='primary')ctx.fillText('FIRE',b.x,b.y+b.r+14);
    else if(b.key==='secondary')ctx.fillText('SPC',b.x,b.y+b.r+14);
    ctx.restore();
  }
}

/* ---------------- BANNERS & SCREEN FLASH ---------------- */
function drawBanner(){
  if(G.bannerT<=0)return;
  const a=clamp(G.bannerT/0.6,0,1);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.fillStyle='rgba(5,6,15,0.55)';
  ctx.fillRect(0,viewH*0.32,viewW,86);
  ctx.shadowColor='#41d9ff';
  ctx.shadowBlur=18;
  ctx.fillStyle='#eaffff';
  ctx.font='bold 28px "Courier New", monospace';
  ctx.textAlign='center';
  ctx.fillText(G.bannerText,viewW/2,viewH*0.32+38);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9be8ff';
  ctx.font='bold 13px "Courier New", monospace';
  ctx.fillText(G.bannerSub,viewW/2,viewH*0.32+64);
  ctx.restore();
}
function drawDamageVignette(){
  /* low-HP heartbeat pulse blends with the hit flash */
  let a=0;
  if(G.dmgFlash>0)a=clamp(G.dmgFlash/0.35,0,1)*0.45;
  if(!player.dead&&player.hp/player.maxHp<0.25){
    const beat=Math.pow(Math.abs(Math.sin(G.gameTime*3.4)),3)*0.3;
    a=Math.max(a,beat);
  }
  if(a>0){
    const vg=ctx.createRadialGradient(viewW/2,viewH/2,Math.min(viewW,viewH)*0.3,
      viewW/2,viewH/2,Math.max(viewW,viewH)*0.72);
    vg.addColorStop(0,'rgba(255,0,30,0)');
    vg.addColorStop(1,'rgba(255,0,30,'+a.toFixed(3)+')');
    ctx.fillStyle=vg;
    ctx.fillRect(0,0,viewW,viewH);
  }
  /* chromatic double-image kick on a fresh big hit */
  if(G.dmgFlash>0.22){
    const k=(G.dmgFlash-0.22)/0.13;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,0,40,'+(0.055*k).toFixed(3)+')';
    ctx.fillRect(5,0,viewW,viewH);
    ctx.fillStyle='rgba(0,200,255,'+(0.055*k).toFixed(3)+')';
    ctx.fillRect(-5,0,viewW,viewH);
    ctx.restore();
  }
}

init();
</script>
