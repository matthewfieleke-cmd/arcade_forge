<script>
/* ============================================================
   WEB APP MANIFEST - embedded as a data URI in the header.
   The 512px icon is rendered procedurally on an offscreen
   canvas so the manifest stays 100% self-contained and valid.
   ============================================================ */
(function buildManifest(){
  try{
    var ic=document.createElement('canvas'); ic.width=512; ic.height=512;
    var g=ic.getContext('2d');
    var bg=g.createLinearGradient(0,0,512,512);
    bg.addColorStop(0,'#0b1228'); bg.addColorStop(1,'#05060f');
    g.fillStyle=bg; g.fillRect(0,0,512,512);
    g.strokeStyle='#41d9ff'; g.lineWidth=14;
    g.shadowColor='#41d9ff'; g.shadowBlur=36;
    g.strokeRect(38,38,436,436);
    g.fillStyle='#41d9ff';
    g.font='bold 200px "Courier New", Courier, monospace';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('AF',256,238);
    g.shadowColor='#ff5fd2'; g.fillStyle='#ff5fd2';
    g.font='bold 52px "Courier New", Courier, monospace';
    g.fillText('FORGE',256,388);
    var iconUrl=ic.toDataURL('image/png');
    var manifest={
      name:'Arcade Forge',
      short_name:'ArcadeForge',
      description:'Self-contained mobile-first game-generating PWA.',
      start_url:'.',
      scope:'.',
      display:'standalone',
      orientation:'any',
      background_color:'#05060f',
      theme_color:'#05060f',
      icons:[
        {src:iconUrl,sizes:'512x512',type:'image/png',purpose:'any'},
        {src:iconUrl,sizes:'192x192',type:'image/png',purpose:'maskable'}
      ]
    };
    var link=document.createElement('link');
    link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }catch(err){ /* manifest is progressive enhancement; app still runs */ }
})();
</script>
<style>
:root{
  --cyan:#41d9ff; --pink:#ff5fd2; --gold:#ffd95f; --green:#7dffa8; --red:#ff6b6b;

  --line:rgba(65,217,255,.28);

  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{
  position:fixed; inset:0; width:100%;
  color:#e8f6ff;
  font:bold 16px 'Courier New', Courier, monospace;
  touch-action:manipulation;
  user-select:none; -webkit-user-select:none;
  overscroll-behavior:none;
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
}
.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding:calc(var(--safe-top) + 16px) 18px calc(var(--safe-bottom) + 16px);
  overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%, #0d1226 0%, #05060f 62%);
}
.hidden{display:none !important;}
::-webkit-scrollbar{width:0;height:0;}

/* ------ HOME ------ */
.brand{text-align:center;margin:6vh 0 24px;}
.brand h1{

}

  50%{text-shadow:0 0 12px rgba(65,217,255,1),0 0 44px rgba(65,217,255,.8),0 0 90px rgba(255,95,210,.55);}

.opt-body{flex:1;min-width:0;}
.opt-name{font-size:16px;letter-spacing:1.5px;color:#eaffff;}

.opt-go{font-size:20px;color:#3d5f7d;}

/* ------ SUMMARY ------ */
.sum-rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}

/* ------ GAME ------ */
#screen-game{padding:0;background:#05060f;}
#game-canvas{

</style>

<script>
'use strict';
/* ============================================================
   ARCADE FORGE - self-contained game-generating PWA.
   All systems live in this single script block:
   data tables, state machine, wizard UI, vault persistence,
   high-DPI delta-time engine, three genre constructors,
   twin-weapon systems, hazards, ultimates, VFX pool, controls.
   ============================================================ */

/* ---------------- UTILITIES ---------------- */
const TAU=Math.PI*2;
const $$=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rand=(a,b)=>a+Math.random()*(b-a);
const dist2=(ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay;return dx*dx+dy*dy;};
const normAngle=a=>((a+Math.PI*3)%TAU)-Math.PI;
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circleRectHit(cx,cy,r,rc){
  const nx=clamp(cx,rc.x,rc.x+rc.w),ny=clamp(cy,rc.y,rc.y+rc.h);
  const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<=r*r;
}
function hash01(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function roundRectPath(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function hexPath(c,cx,cy,r,rot){
  c.beginPath();
  for(let i=0;i<6;i++){
    const a=rot+i/6*TAU;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
  }
  c.closePath();
}

/* ---------------- CONFIGURATION DATA TABLES ---------------- */
const GENRES=[
  {name:'SIDE-SCROLLER PLATFORMER',short:'PLATFORMER',icon:'\u259B',accent:'#41d9ff',
   desc:'Gravity combat across floating ledges. Fight to the exit portal at the far edge of every level.'},
  {name:'ENDLESS RUNNER',short:'RUNNER',icon:'\u00BB',accent:'#ffd95f',
   desc:'Auto-scrolling sprint at accelerating speed. Jump the blocks, slide under the beams, survive the distance.'},
  {name:'TOP-DOWN ARENA',short:'ARENA',icon:'\u25CE',accent:'#ff5fd2',
   desc:'8-way locked combat zone with a hard perimeter. Purge the full hostile quota to advance.'}
];
const HEROES=[
  {name:'PLASMA MECH',icon:'\u25A3',accent:'#41d9ff',primCd:1.0,primDmg:14,
   primName:'PLASMA BLASTER',secName:'HOMING ROCKETS',
   desc:'Primary: linear blue plasma bolts (1.0s). Secondary: 3 tracking rockets with smoke trails + cluster blasts (5s).'},
  {name:'CYBER CAT',icon:'\u25C8',accent:'#ff5fd2',primCd:0.8,primDmg:11,
   primName:'ENERGY SWIPES',secName:'YARN BALL',
   desc:'Primary: wide neon crescent slashes (0.8s). Secondary: heavy pink yarn ball that ricochets and pierces (5s).'},
  {name:'WIZARD HERO',icon:'\u2726',accent:'#b98bff',primCd:1.2,primDmg:18,
   primName:'FIRE BLAST',secName:'MINION SUMMON',
   desc:'Primary: piercing directional fireballs (1.2s). Secondary: 2 orbiting wisps auto-firing micro-beads for 4s (5s).'}
];
const DIFFS=[
  {name:'CASUAL',icon:'\u25D4',accent:'#7dffa8',
   desc:'Low threat. Reinforced hull, sparse hostiles, forgiving damage.',
   mods:{hp:1.4,dmgTaken:0.65,eHp:0.8,eSpd:0.85,spawn:0.75,score:1}},
  {name:'STANDARD',icon:'\u25D1',accent:'#ffd95f',
   desc:'Medium threat. Balanced combat calibration, 1.5x score.',
   mods:{hp:1.0,dmgTaken:1.0,eHp:1.0,eSpd:1.0,spawn:1.0,score:1.5}},
  {name:'HARDCORE',icon:'\u25CF',accent:'#ff6b6b',
   desc:'High threat. Glass cannon protocol, dense spawns, 2.25x score.',
   mods:{hp:0.75,dmgTaken:1.5,eHp:1.35,eSpd:1.15,spawn:1.35,score:2.25}}
];
const ENEMY_TYPES=[
  {name:'GHOSTLY SPIRITS',icon:'\u25CD',accent:'#bfeaff',
   desc:'Semi-phased floaters that ignore terrain and home in through the air.'},
  {name:'EVIL ROBOTS',icon:'\u25A4',accent:'#ff6b6b',
   desc:'Armored walkers with red laser optics and ranged suppression fire.'},
  {name:'PLANT MONSTERS',icon:'\u273B',accent:'#7dffa8',
   desc:'Rooted horrors that lunge at close range and spit arcing acid seeds.'}
];
const ENVS=[
  {name:'VOLCANIC JUNGLE',hazard:'LAVA HAZARD',icon:'\u25B2',accent:'#ff7a3c',
   desc:'Smoldering canopy over magma veins. Lava geysers erupt from the ground.',
   pal:{sky0:'#1c0505',sky1:'#4a1505',ground:'#2e1410',edge:'#ff7a3c',plat:'#3b1b12',line:'#ff9c54'}},
  {name:'DEEP SPACE STATION',hazard:'ASTEROID HAZARD',icon:'\u2736',accent:'#7db4ff',
   desc:'Orbital hull plates under starlight. Rogue asteroids punch through the zone.',
   pal:{sky0:'#02030f',sky1:'#0a1430',ground:'#121a2e',edge:'#5fa8ff',plat:'#16203a',line:'#9cc4ff'}},
  {name:'HAUNTED HOUSE',hazard:'PHANTOM HAZARD',icon:'\u2302',accent:'#b98bff',
   desc:'Rotting halls under a dead moon. Phantoms materialize and drift for the kill.',
   pal:{sky0:'#0a0712',sky1:'#1e1430',ground:'#171028',edge:'#9d6bff',plat:'#1f1535',line:'#c9a6ff'}}
];
const ULTS=[
  {name:'TIME STOP',icon:'\u25F7',accent:'#9be8ff',
   desc:'Freeze every hostile, hazard and enemy shot for 4s while you stay fully live.'},
  {name:'SUPER SHIELD',icon:'\u2B21',accent:'#5fa8ff',
   desc:'6s invulnerable hex barrier that burns any hostile it touches.'},
  {name:'OVERDRIVE',icon:'\u21AF',accent:'#ffb347',
   desc:'5s of double damage, hyper fire-rate and boosted movement speed.'}
];
const WIZ=[
  {key:'genre',title:'SELECT GENRE',sub:'CORE SIMULATION ARCHITECTURE',opts:GENRES},
  {key:'hero',title:'SELECT HERO',sub:'COMBAT CHASSIS & TWIN-WEAPON LOADOUT',opts:HEROES},
  {key:'diff',title:'SELECT DIFFICULTY',sub:'THREAT CALIBRATION',opts:DIFFS},
  {key:'enemy',title:'SELECT ENEMIES',sub:'HOSTILE FACTION',opts:ENEMY_TYPES},
  {key:'env',title:'ENVIRONMENT & HAZARD',sub:'DEPLOYMENT ZONE',opts:ENVS},
  {key:'ult',title:'SELECT ULTIMATE',sub:'LIMIT-BREAK PROTOCOL',opts:ULTS}
];

/* ---------------- VAULT (localStorage persistence) ---------------- */
const VAULT_KEY='arcade_forge_vault';
function loadVault(){
  try{
    const raw=localStorage.getItem(VAULT_KEY);
    if(!raw)return[];
    const v=JSON.parse(raw);
    if(!Array.isArray(v))return[];
    return v.filter(e=>e&&Array.isArray(e.cfg)&&e.cfg.length===6);
  }catch(err){return[];}
}
function saveVault(v){
  try{localStorage.setItem(VAULT_KEY,JSON.stringify(v));}catch(err){}
}
function cfgLabel(cfg){
  return GENRES[cfg[0]].short+' \u00B7 '+HEROES[cfg[1]].name+' \u00B7 '+DIFFS[cfg[2]].name+' \u00B7 '+ENVS[cfg[4]].name;
}

/* ============================================================
   APPLICATION STATE MACHINE
   States: HOME_MENU, WIZARD_STEP, GAME_SUMMARY, ACTIVE_GAME,
           GAME_OVER, VICTORY
   ============================================================ */
let appState='HOME_MENU';
const SCREENS={
  HOME_MENU:'screen-home',
  WIZARD_STEP:'screen-wizard',
  GAME_SUMMARY:'screen-summary',
  ACTIVE_GAME:'screen-game',
  GAME_OVER:'screen-end',
  VICTORY:'screen-end'
};
let wizardIdx=0;
let wizardSel=[0,0,0,0,0,0];
let lastCfg=null;
let saveFeedbackTimer=null;

function setAppState(next){
  if(appState==='ACTIVE_GAME'&&next!=='ACTIVE_GAME')cleanupGame();
  appState=next;
  ['screen-home','screen-wizard','screen-summary','screen-game','screen-end']
    .forEach(id=>$$('#'+id).classList.add('hidden'));
  $$('#'+SCREENS[next]).classList.remove('hidden');
  if(next==='HOME_MENU')renderHome();
  else if(next==='WIZARD_STEP')renderWizard();
  else if(next==='GAME_SUMMARY')renderSummary();
  else if(next==='GAME_OVER'||next==='VICTORY')renderEnd(next==='VICTORY');
}

/* ---------------- HOME_MENU ---------------- */
function renderHome(){
  const list=$$('#vault-list');
  list.innerHTML='';
  const vault=loadVault();
  if(!vault.length){
    const empty=document.createElement('div');
    empty.className='vault-empty';
    empty.textContent='NO SAVED RIGS DETECTED. FORGE YOUR FIRST GAME TO POPULATE THE VAULT.';
    list.appendChild(empty);
    return;
  }
  vault.forEach((entry,i)=>{
    const item=document.createElement('div');
    item.className='vault-item';
    item.style.borderLeftColor=HEROES[entry.cfg[1]].accent;
    const body=document.createElement('div');
    body.className='vi-body';
    const nm=document.createElement('div');
    nm.className='vi-name';
    nm.textContent=entry.name;
    const sub=document.createElement('div');
    sub.className='vi-sub';
    sub.textContent=cfgLabel(entry.cfg);
    body.appendChild(nm);body.appendChild(sub);
    const play=document.createElement('div');
    play.className='vi-play';
    play.textContent='\u25B6';
    const del=document.createElement('button');
    del.className='vault-del';
    del.textContent='\u2715';
    del.addEventListener('click',ev=>{
      ev.stopPropagation();
      const v=loadVault();
      v.splice(i,1);
      saveVault(v);
      renderHome();
    });
    item.appendChild(body);item.appendChild(play);item.appendChild(del);
    item.addEventListener('click',()=>{ startRun(entry.cfg.slice()); });
    list.appendChild(item);
  });
}

/* ---------------- WIZARD_STEP ---------------- */
function renderWizard(){
  const step=WIZ[wizardIdx];
  $$('#wiz-step-label').textContent='STEP '+(wizardIdx+1)+'/6';
  $$('#wiz-title').textContent=step.title;
  $$('#wiz-sub').textContent=step.sub;

  dots.innerHTML='';
  for(let i=0;i<WIZ.length;i++){
    const d=document.createElement('div');
    d.className='wiz-dot'+(i<=wizardIdx?' on':'');
    dots.appendChild(d);
  }
  const cards=$$('#wiz-cards');
  cards.innerHTML='';
  step.opts.forEach((opt,oi)=>{
    const card=document.createElement('div');
    card.className='opt-card';
    card.style.borderColor=opt.accent+'55';
    const ico=document.createElement('div');
    ico.className='opt-icon';
    ico.style.color=opt.accent;
    ico.style.border='1px solid '+opt.accent+'66';
    ico.style.textShadow='0 0 12px '+opt.accent;
    ico.textContent=opt.icon;
    const body=document.createElement('div');
    body.className='opt-body';
    const nm=document.createElement('div');
    nm.className='opt-name';
    nm.textContent=opt.name+(opt.hazard?' \u00B7 '+opt.hazard:'');
    const ds=document.createElement('div');
    ds.className='opt-desc';
    ds.textContent=opt.desc;
    body.appendChild(nm);body.appendChild(ds);
    const go=document.createElement('div');
    go.className='opt-go';
    go.textContent='\u203A';
    card.appendChild(ico);card.appendChild(body);card.appendChild(go);
    card.addEventListener('click',()=>{

/* ---------------- GAME_SUMMARY ---------------- */
function renderSummary(){
  const rows=$$('#sum-rows');
  rows.innerHTML='';
  WIZ.forEach((step,i)=>{
    const opt=step.opts[wizardSel[i]];
    const row=document.createElement('div');
    row.className='sum-row';
    const ico=document.createElement('div');
    ico.className='sum-ico';
    ico.style.color=opt.accent;
    ico.style.border='1px solid '+opt.accent+'66';
    ico.textContent=opt.icon;
    const body=document.createElement('div');
    const lb=document.createElement('div');
    lb.className='sum-label';
    lb.textContent=step.title.replace('SELECT ','');
    const vl=document.createElement('div');
    vl.className='sum-value';
    vl.textContent=opt.name+(opt.hazard?' \u00B7 '+opt.hazard:'');
    body.appendChild(lb);body.appendChild(vl);
    row.appendChild(ico);row.appendChild(body);
    rows.appendChild(row);
  });
  const saveBtn=$$('#btn-save');
  saveBtn.textContent='SAVE TO VAULT';
  if(saveFeedbackTimer){clearTimeout(saveFeedbackTimer);saveFeedbackTimer=null;}
}

function commitToVault(){
  const input=$$('#sum-name');
  let name=(input.value||'').trim().toUpperCase();
  if(!name)name='RIG-'+String(Date.now()%100000).padStart(5,'0');
  const vault=loadVault();
  vault.unshift({name:name,cfg:wizardSel.slice(),ts:Date.now()});
  while(vault.length>30)vault.pop();
  saveVault(vault);
  const saveBtn=$$('#btn-save');
  saveBtn.textContent='SAVED TO VAULT \u2713';
  if(saveFeedbackTimer)clearTimeout(saveFeedbackTimer);
  saveFeedbackTimer=setTimeout(()=>{
    saveBtn.textContent='SAVE TO VAULT';
    saveFeedbackTimer=null;
  },1400);
}

/* ---------------- GAME_OVER / VICTORY ---------------- */
function renderEnd(victory){
  const title=$$('#end-title');
  title.textContent=victory?'VICTORY':'GAME OVER';
  title.className='end-title '+(victory?'win':'lose');
  const stats=$$('#end-stats');
  stats.innerHTML='';
  const add=(k,v)=>{
    const row=document.createElement('div');
    row.className='end-stat';
    const ke=document.createElement('div');ke.className='k';ke.textContent=k;
    const ve=document.createElement('div');ve.className='v';ve.textContent=v;
    row.appendChild(ke);row.appendChild(ve);
    stats.appendChild(row);
  };
  add('FINAL SCORE',String(Math.floor(G.score)));
  add('LEVEL REACHED',G.level+' / 10');
  add('HOSTILES PURGED',String(G.totalKills));
  if(lastCfg){
    add('LOADOUT',HEROES[lastCfg[1]].name);
    add('SIMULATION',GENRES[lastCfg[0]].short+' \u00B7 '+ENVS[lastCfg[4]].name);
  }
}

/* ---------------- RUN LAUNCHER ---------------- */

  lastCfg=cfgArr.slice();
  setAppState('ACTIVE_GAME');

}

   ENGINE CORE - high-DPI canvas, delta-time loop, world build
   ============================================================ */

let viewW=0,viewH=0,dpr=1;
let rafId=null,lastTs=0;
let eid=1;

const G={
  running:false,over:false,victory:false,endT:0,

/* ---------------- HIGH-DPI CANVAS ---------------- */
function setupCanvas(){
  dpr=clamp(window.devicePixelRatio||1,1,3);
  viewW=window.innerWidth;
  viewH=window.innerHeight;
  canvas.width=Math.round(viewW*dpr);
  canvas.height=Math.round(viewH*dpr);
  canvas.style.width='100%';
  canvas.style.height='100%';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  layoutControls();
}
function onResize(){
  if(!canvas)return;
  setupCanvas();
  if(G.running&&G.cfg&&G.cfg.genre===2){
    buildArenaWalls();
    player.x=clamp(player.x,24,viewW-24-player.w);
    player.y=clamp(player.y,24,viewH-24-player.h);
  }
}

/* ---------------- VIRTUAL CONTROLS (PointerEvents) ---------------- */
const activePointers=new Map();
const stick={active:false,id:null,ox:0,oy:0,dx:0,dy:0,nx:0,ny:0,mag:0,rad:56,restX:90,restY:0};
const vbtns=[
  {key:'primary',label:'FIRE',x:0,y:0,r:44,held:false},
  {key:'secondary',label:'SPC',x:0,y:0,r:36,held:false},
  {key:'ult',label:'ULT',x:0,y:0,r:36,held:false}
];
const quitBtn={x:0,y:30,r:20};

function layoutControls(){
  const m=Math.min(viewW,viewH);
  stick.rad=clamp(m*0.115,46,66);
  stick.restX=stick.rad+36;
  stick.restY=viewH-stick.rad-46;
  const r=clamp(m*0.088,34,52);
  const b1=vbtns[0],b2=vbtns[1],b3=vbtns[2];
  b1.r=r;      b1.x=viewW-r-26;            b1.y=viewH-r-36;
  b2.r=r*0.78; b2.x=viewW-r*2-b2.r-58;     b2.y=viewH-b2.r-28;
  b3.r=r*0.8;  b3.x=viewW-r-28;            b3.y=b1.y-r-b3.r-24;
  quitBtn.x=viewW-28;
  quitBtn.y=Math.max(30,16+(window.visualViewport?0:0)+14);
}
function resetStick(){
  stick.active=false;stick.id=null;
  stick.dx=0;stick.dy=0;stick.nx=0;stick.ny=0;stick.mag=0;
}
function pointerPos(e){
  const rect=canvas.getBoundingClientRect();
  return{x:e.clientX-rect.left,y:e.clientY-rect.top};
}
function onPointerDown(e){
  e.preventDefault();
  const p=pointerPos(e);
  if(dist2(p.x,p.y,quitBtn.x,quitBtn.y)<(quitBtn.r+8)*(quitBtn.r+8)){
    setAppState('HOME_MENU');
    return;
  }
  for(const b of vbtns){
    if(dist2(p.x,p.y,b.x,b.y)<=(b.r*1.25)*(b.r*1.25)){
      activePointers.set(e.pointerId,{type:'btn',btn:b});
      b.held=true;
      if(b.key==='secondary')trySecondary();
      else if(b.key==='ult')tryUltimate();
      return;
    }
  }
  if(p.x<viewW*0.55&&!stick.active){
    stick.active=true;
    stick.id=e.pointerId;
    stick.ox=p.x;stick.oy=p.y;
    stick.dx=0;stick.dy=0;stick.nx=0;stick.ny=0;stick.mag=0;
    activePointers.set(e.pointerId,{type:'stick'});
  }
}
function onPointerMove(e){
  const entry=activePointers.get(e.pointerId);
  if(!entry)return;
  e.preventDefault();
  if(entry.type==='stick'&&e.pointerId===stick.id){
    const p=pointerPos(e);
    let dx=p.x-stick.ox,dy=p.y-stick.oy;
    const d=Math.hypot(dx,dy);
    if(d>stick.rad){dx*=stick.rad/d;dy*=stick.rad/d;}
    stick.dx=dx;stick.dy=dy;
    stick.nx=dx/stick.rad;stick.ny=dy/stick.rad;
    stick.mag=Math.min(1,d/stick.rad);
  }
}
function onPointerUp(e){
  const entry=activePointers.get(e.pointerId);
  if(!entry)return;
  if(entry.type==='stick'&&e.pointerId===stick.id)resetStick();
  if(entry.type==='btn')entry.btn.held=false;
  activePointers.delete(e.pointerId);
}
function onCtxMenu(e){e.preventDefault();}

function attachGameInput(){
  canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
  canvas.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp,{passive:false});
  window.addEventListener('pointercancel',onPointerUp,{passive:false});
  canvas.addEventListener('contextmenu',onCtxMenu);
}
function detachGameInput(){
  canvas.removeEventListener('pointerdown',onPointerDown);
  canvas.removeEventListener('pointermove',onPointerMove);
  window.removeEventListener('pointerup',onPointerUp);
  window.removeEventListener('pointercancel',onPointerUp);
  canvas.removeEventListener('contextmenu',onCtxMenu);
  activePointers.clear();
  resetStick();
  for(const b of vbtns)b.held=false;
}

/* ---------------- GAME LIFECYCLE ---------------- */
function initGame(cfgArr){
  G.cfg={genre:cfgArr[0],hero:cfgArr[1],diff:cfgArr[2],enemy:cfgArr[3],env:cfgArr[4],ult:cfgArr[5]};
  G.level=1;G.score=0;G.totalKills=0;G.gameTime=0;
  G.over=false;G.victory=false;G.endT=0;
  G.isTimeStopped=false;G.timeStopT=0;
  G.shakeT=0;G.shakeMag=0;G.dmgFlash=0;
  setupCanvas();
  initPlayer();
  buildWorld();
  attachGameInput();
  G.running=true;
  lastTs=performance.now();
  if(rafId!==null)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function cleanupGame(){
  if(rafId!==null){cancelAnimationFrame(rafId);rafId=null;}
  detachGameInput();
  G.running=false;
}
function initPlayer(){
  const D=diffMods();
  player.maxHp=Math.round(100*D.hp);
  player.hp=player.maxHp;
  player.maxShield=60;
  player.shield=player.maxShield;
  player.ult=0;
  player.w=30;player.h=42;player.baseH=42;
  player.vx=0;player.vy=0;player.facing=1;
  player.onGround=false;player.sliding=false;player.jumpHeld=false;
  player.primCd=0;player.secCd=0;player.secCdMax=5;
  player.invulnT=0;player.shieldUltT=0;player.overdriveT=0;player.trailT=0;
  player.dead=false;
}

/* ---------------- GENRE-SPECIFIC WORLD CONSTRUCTOR ---------------- */
function buildWorld(){
  enemies.length=0;projs.length=0;eprojs.length=0;
  platforms.length=0;walls.length=0;obstacles.length=0;
  hazards.length=0;pickups.length=0;wisps.length=0;
  telegraphs.length=0;clusters.length=0;
  for(const p of particles)p.active=false;
  const D=diffMods();
  const g=G.cfg.genre,lvl=G.level;
  G.kills=0;G.spawned=0;
  G.envT=2.4;G.enSpawnT=1.2;G.obSpawnT=1.0;
  G.portal=null;
  player.vx=0;player.vy=0;player.sliding=false;
  player.h=player.baseH;

  if(g===0){
    /* SIDE-SCROLLER PLATFORMER: flat terrain boundary + 4 floating ledges */
    G.worldW=2400+lvl*420;
    G.groundY=Math.round(viewH*0.78);
    G.camX=0;
    platforms.push({x:-200,y:G.groundY,w:G.worldW+400,h:viewH-G.groundY+260});
    for(let i=0;i<4;i++){
      const pw=150+rand(0,130);
      const px=clamp(G.worldW*(0.16+0.18*i)+rand(-90,90),260,G.worldW-pw-260);
      const py=G.groundY-(92+rand(0,134));
      platforms.push({x:px,y:py,w:pw,h:18});
    }
    G.portal={x:G.worldW-118,y:G.groundY-96,w:48,h:96};
    player.x=70;player.y=G.groundY-player.h;
    const count=Math.round((5+lvl*1.7)*D.spawn);
    for(let i=0;i<count;i++){
      const ex=rand(420,G.worldW-300);
      let ey;
      if(G.cfg.enemy===0){ ey=G.groundY-rand(120,260); }
      else if(Math.random()<0.35&&platforms.length>1){
        const pl=platforms[1+Math.floor(Math.random()*4)];
        ey=pl.y-44;
        enemies.push(makeEnemy(clamp(ex,pl.x+8,pl.x+pl.w-48),ey));
        continue;
      } else { ey=G.groundY-44; }
      enemies.push(makeEnemy(ex,ey));
    }
  } else if(g===1){
    /* ENDLESS RUNNER: auto-scrolling, accelerating camera */
    G.worldW=Infinity;
    G.groundY=Math.round(viewH*0.8);
    G.camX=0;
    G.runSpeed=230+lvl*28;
    G.runAccel=6+lvl*1.6;
    G.runDist=0;
    G.runGoal=800+lvl*300;
    G.obSpawnT=1.4;
    G.enSpawnT=2.2;
    player.x=viewW*0.24;player.y=G.groundY-player.h;
  } else {
    /* TOP-DOWN ARENA: perimeter boundary locks the combat zone */
    G.worldW=viewW;
    G.groundY=viewH;
    G.camX=0;
    buildArenaWalls();
    G.killQuota=8+lvl*3;
    G.maxAlive=Math.round((3+lvl*0.7)*D.spawn);
    G.enSpawnT=0.8;
    player.x=viewW/2-player.w/2;
    player.y=viewH/2-player.h/2;
  }
  G.bannerText='LEVEL '+lvl+' / 10';
  G.bannerSub=g===0?'REACH THE EXIT PORTAL'
            :g===1?'SURVIVE '+G.runGoal+'m'
            :'PURGE '+G.killQuota+' HOSTILES';
  G.bannerT=2.4;
}
function buildArenaWalls(){
  walls.length=0;
  const t=12,m=6;
  walls.push({x:m,y:m,w:viewW-m*2,h:t});
  walls.push({x:m,y:viewH-m-t,w:viewW-m*2,h:t});
  walls.push({x:m,y:m,w:t,h:viewH-m*2});
  walls.push({x:viewW-m-t,y:m,w:t,h:viewH-m*2});
}
function resolveWalls(ent){
  for(const w of walls){
    if(!rectsOverlap(ent,w))continue;
    const ox1=ent.x+ent.w-w.x,ox2=w.x+w.w-ent.x;
    const oy1=ent.y+ent.h-w.y,oy2=w.y+w.h-ent.y;
    const ox=Math.min(ox1,ox2),oy=Math.min(oy1,oy2);
    if(ox<oy){
      if(ox1<ox2){ent.x-=ox1;if(ent.vx>0)ent.vx=0;}
      else{ent.x+=ox2;if(ent.vx<0)ent.vx=0;}
    }else{
      if(oy1<oy2){ent.y-=oy1;if(ent.vy>0)ent.vy=0;}
      else{ent.y+=oy2;if(ent.vy<0)ent.vy=0;}
    }
  }
}
function groundLand(ent,prevY){
  ent.onGround=false;
  if(G.cfg.genre===1){
    if(ent.y+ent.h>=G.groundY){
      ent.y=G.groundY-ent.h;ent.vy=0;ent.onGround=true;
    }
    return;
  }
  for(const p of platforms){
    if(ent.vy>=0&&prevY+ent.h<=p.y+8&&
       ent.x+ent.w>p.x+2&&ent.x<p.x+p.w-2&&
       ent.y+ent.h>=p.y&&ent.y+ent.h<=p.y+p.h+36){
      ent.y=p.y-ent.h;ent.vy=0;ent.onGround=true;
    }
  }
}

/* ---------------- DELTA-TIME GAME LOOP ---------------- */
function loop(ts){
  rafId=requestAnimationFrame(loop);
  if(!G.running)return;
  let dt=(ts-lastTs)/1000;
  lastTs=ts;
  if(!(dt>0))dt=0.0001;
  if(dt>0.05)dt=0.05;
  update(dt);
  render();
}

function update(dt){
  G.gameTime+=dt;
  if(G.shakeT>0)G.shakeT-=dt;
  if(G.over){
    G.endT-=dt;
    updateParticles(dt);
    updateClusters(dt);
    if(G.endT<=0){
      const victory=G.victory;
      G.running=false;
      setAppState(victory?'VICTORY':'GAME_OVER');
    }
    return;
  }
  if(G.isTimeStopped){
    G.timeStopT-=dt;
    if(G.timeStopT<=0){
      G.isTimeStopped=false;
      burstParticles(player.x+player.w/2,player.y+player.h/2,14,180,3,0.4,[155,232,255],[60,90,160],0);
    }
  }
  if(player.invulnT>0)player.invulnT-=dt;
  if(player.shieldUltT>0)player.shieldUltT-=dt;
  if(player.overdriveT>0)player.overdriveT-=dt;
  if(G.dmgFlash>0)G.dmgFlash-=dt;
  if(G.bannerT>0)G.bannerT-=dt;

  updatePlayer(dt);
  updateWeapons(dt);
  updateWisps(dt);
  updateProjectiles(dt);
  updateClusters(dt);
  if(!G.isTimeStopped){
    updateEnemies(dt);
    updateEnemyProjectiles(dt);
    updateHazards(dt);
    updateSpawners(dt);
  }
  updatePickups(dt);
  handleProjectileHits();
  handlePlayerCollisions(dt);
  updateParticles(dt);
  updateCamera(dt);
  checkLevelProgress();
  cleanupDead();
}

/* ---------------- PLAYER PHYSICS (per genre) ---------------- */
function updatePlayer(dt){
  if(player.dead)return;
  const ov=player.overdriveT>0;
  const g=G.cfg.genre;
  if(g===0){
    const spd=252*(ov?1.4:1);
    player.vx+=(stick.nx*spd-player.vx)*Math.min(1,dt*12);
    player.vy+=1500*dt;
    if(player.vy>950)player.vy=950;
    const wantJump=stick.ny<-0.45;
    if(wantJump&&player.onGround&&!player.jumpHeld){
      player.vy=-635;player.onGround=false;
      burstParticles(player.x+player.w/2,player.y+player.h,6,90,2.5,0.35,[200,230,255],[80,120,160],260);
    }
    player.jumpHeld=wantJump;
    const prevY=player.y;
    player.x+=player.vx*dt;
    player.x=clamp(player.x,0,G.worldW-player.w);
    player.y+=player.vy*dt;
    groundLand(player,prevY);
  } else if(g===1){
    if(!G.isTimeStopped){
      G.runSpeed=Math.min(760,G.runSpeed+G.runAccel*dt);
      G.camX+=G.runSpeed*dt;
      G.runDist+=G.runSpeed*dt*0.1;
    }
    const targetX=G.camX+viewW*0.24+stick.nx*viewW*0.13;
    player.x+=(targetX-player.x)*Math.min(1,dt*7);
    player.vy+=1650*dt;
    if(player.vy>1050)player.vy=1050;
    const wantJump=stick.ny<-0.45;
    if(wantJump&&player.onGround&&!player.jumpHeld){
      player.vy=-665;player.onGround=false;
      burstParticles(player.x+player.w/2,player.y+player.h,6,90,2.5,0.35,[200,230,255],[80,120,160],260);
    }
    player.jumpHeld=wantJump;
    const wasSliding=player.sliding;
    player.sliding=stick.ny>0.45&&player.onGround;
    const bottom=player.y+player.h;
    player.h=player.sliding?22:player.baseH;
    player.y=bottom-player.h;
    if(player.sliding&&!wasSliding){
      burstParticles(player.x,player.y+player.h,5,80,2,0.3,[200,200,210],[90,90,110],100);
    }
    const prevY=player.y;
    player.y+=player.vy*dt;
    groundLand(player,prevY);
  } else {
    const acc=1500*(ov?1.3:1),maxV=330*(ov?1.35:1);
    player.vx+=stick.nx*acc*dt;
    player.vy+=stick.ny*acc*dt;
    const drag=Math.max(0,1-4.5*dt);
    if(Math.abs(stick.nx)<0.12)player.vx*=drag;
    if(Math.abs(stick.ny)<0.12)player.vy*=drag;
    const sp=Math.hypot(player.vx,player.vy);
    if(sp>maxV){player.vx*=maxV/sp;player.vy*=maxV/sp;}
    player.x+=player.vx*dt;
    player.y+=player.vy*dt;
    resolveWalls(player);
  }
  if(Math.abs(stick.nx)>0.2)player.facing=stick.nx>0?1:-1;
  if(ov){
    player.trailT-=dt;
    if(player.trailT<=0){
      player.trailT=0.05;
      spawnParticle(player.x+player.w/2,player.y+player.h/2,
        -player.vx*0.25+rand(-20,20),-player.vy*0.25+rand(-20,20),
        5,0.32,[255,179,71],[200,40,20],0);
    }
  }
}

/* ---------------- CAMERA / PROGRESS / TRANSITIONS ---------------- */
function updateCamera(dt){

  if(g===0){
    G.camX=clamp(player.x+player.w/2-viewW*0.4,0,Math.max(0,G.worldW-viewW));

function checkLevelProgress(){
  if(player.dead||G.over)return;
  const g=G.cfg.genre;
  if(g===0&&G.portal&&rectsOverlap(player,G.portal))nextLevel();
  else if(g===1&&G.runDist>=G.runGoal)nextLevel();
  else if(g===2&&G.kills>=G.killQuota)nextLevel();
}
function nextLevel(){
  G.score+=500*G.level*diffMods().score;
  burstParticles(player.x+player.w/2,player.y+player.h/2,24,260,3.5,0.6,[255,255,255],[255,217,95],0);
  if(G.level>=10){triggerEnd(true);return;}
  G.level++;
  player.hp=Math.min(player.maxHp,player.hp+player.maxHp*0.3);
  player.shield=Math.min(player.maxShield,player.shield+20);
  buildWorld();
}
function triggerEnd(victory){
  G.over=true;
  G.victory=victory;
  G.endT=victory?1.5:1.7;

function die(){

  burstParticles(player.x+player.w/2,player.y+player.h/2,40,340,4,0.9,[255,255,255],[255,80,60],200);

}
function addShake(mag,dur){
  G.shakeMag=Math.max(G.shakeMag*(G.shakeT>0?1:0),mag);
  G.shakeT=Math.max(G.shakeT,dur);
  G.shakeDur=Math.max(dur,0.001);
}

/* ---------------- SERVICE WORKER (self-contained Blob URL) ---------------- */
function registerServiceWorker(){
  if(!('serviceWorker' in navigator))return;
  try{
    const swCode=
      "const CACHE='arcade-forge-v1';"+
      "self.addEventListener('install',e=>{"+
        "e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']).catch(()=>{})));"+
        "self.skipWaiting();"+
      "});"+
      "self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});"+
      "self.addEventListener('fetch',e=>{"+
        "e.respondWith("+
          "caches.match(e.request).then(hit=>hit||fetch(e.request).then(net=>{"+
            "const copy=net.clone();"+
            "caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});"+
            "return net;"+
          "}).catch(()=>caches.match('./')))"+
        ");"+
      "});";
    const blobUrl=URL.createObjectURL(new Blob([swCode],{type:'text/javascript'}));
    navigator.serviceWorker.register(blobUrl,{scope:'./'})
      .then(()=>{ /* offline cache armed */ })
      .catch(err=>{
        /* Some engines refuse blob: SW scripts; the app remains fully functional. */
        console.info('ArcadeForge SW (blob) unavailable:',err&&err.message);
      });
  }catch(err){
    console.info('ArcadeForge SW setup skipped:',err&&err.message);
  }
}

/* ============================================================
   VFX PARTICLE MATRIX - pre-allocated pool of 300 objects
   ============================================================ */
const PARTICLE_POOL=300;
const particles=new Array(PARTICLE_POOL);
for(let i=0;i<PARTICLE_POOL;i++){
  particles[i]={active:false,x:0,y:0,vx:0,vy:0,size:0,life:0,maxLife:1,
                r0:255,g0:255,b0:255,r1:255,g1:255,b1:255,grav:0,decay:0.9};
}
let particleCursor=0;
function spawnParticle(x,y,vx,vy,size,life,c0,c1,grav){
  const p=particles[particleCursor];
  particleCursor=(particleCursor+1)%PARTICLE_POOL;
  p.active=true;
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;
  p.size=size;p.life=life;p.maxLife=life;
  p.r0=c0[0];p.g0=c0[1];p.b0=c0[2];
  p.r1=c1[0];p.g1=c1[1];p.b1=c1[2];
  p.grav=grav||0;
  p.decay=0.92;
}
function burstParticles(x,y,count,speed,size,life,c0,c1,grav){
  for(let i=0;i<count;i++){
    const a=Math.random()*TAU;
    const sp=speed*(0.35+Math.random()*0.65);
    spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,
      size*(0.6+Math.random()*0.8),life*(0.6+Math.random()*0.8),c0,c1,grav);
  }
}
function updateParticles(dt){
  for(const p of particles){
    if(!p.active)continue;
    p.life-=dt;
    if(p.life<=0){p.active=false;continue;}
    p.vy+=p.grav*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=Math.max(0,1-1.6*dt);
    p.vy*=Math.max(0,1-1.6*dt);
  }
}

/* ============================================================
   TWIN-WEAPON & COOLDOWN ENGINE
   ============================================================ */
function nearestEnemyTo(x,y,maxDist){
  let best=null,bestD=maxDist*maxDist;
  for(const en of enemies){
    if(en.dead)continue;
    const d=dist2(x,y,en.x+en.w/2,en.y+en.h/2);
    if(d<bestD){bestD=d;best=en;}
  }
  return best;
}
function getAim(){
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  const t=nearestEnemyTo(pcx,pcy,560);
  if(t){
    const dx=t.x+t.w/2-pcx,dy=t.y+t.h/2-pcy;
    const d=Math.hypot(dx,dy)||1;
    return{x:dx/d,y:dy/d};
  }
  if(G.cfg.genre===2&&(Math.abs(stick.nx)>0.25||Math.abs(stick.ny)>0.25)){
    const m=Math.hypot(stick.nx,stick.ny)||1;
    return{x:stick.nx/m,y:stick.ny/m};
  }
  return{x:player.facing,y:0};
}
function updateWeapons(dt){
  if(player.dead)return;
  const cdMul=player.overdriveT>0?0.3:1;
  if(player.primCd>0)player.primCd-=dt;

    firePrimary();
    player.primCd=heroDef().primCd*cdMul;

}
function dmgMul(){return player.overdriveT>0?2:1;}

/* ---------------- WISP MINIONS ---------------- */
function updateWisps(dt){

      if(tgt){
        const dx=tgt.x+tgt.w/2-wx,dy=tgt.y+tgt.h/2-wy;

        projs.push({kind:'bead',x:wx,y:wy,vx:dx/d*520,vy:dy/d*520,r:3.5,dmg:5*dmgMul(),life:1.1});
        w.shootT=0.5;
      } else w.shootT=0.2;
