<script>
/* ============================================================
   WEB APP MANIFEST - embedded as a data URI in the header.
   The 512px icon is rendered procedurally on an offscreen
   canvas so the manifest stays 100% self-contained and valid.
   ============================================================ */
(function buildManifest(){
  try{
    var ic=document.createElement('canvas'); ic.width=512; ic.height=512;
    var g=ic.getContext('2d');
    var bg=g.createLinearGradient(0,0,512,512);
    bg.addColorStop(0,'#0b1228'); bg.addColorStop(1,'#05060f');
    g.fillStyle=bg; g.fillRect(0,0,512,512);
    g.strokeStyle='#41d9ff'; g.lineWidth=14;
    g.shadowColor='#41d9ff'; g.shadowBlur=36;
    g.strokeRect(38,38,436,436);
    g.fillStyle='#41d9ff';
    g.font='bold 200px "Courier New", Courier, monospace';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('AF',256,238);
    g.shadowColor='#ff5fd2'; g.fillStyle='#ff5fd2';
    g.font='bold 52px "Courier New", Courier, monospace';
    g.fillText('FORGE',256,388);
    var iconUrl=ic.toDataURL('image/png');
    var manifest={
      name:'Arcade Forge',
      short_name:'ArcadeForge',
      description:'Self-contained mobile-first game-generating PWA.',
      start_url:'.',
      scope:'.',
      display:'standalone',
      orientation:'any',
      background_color:'#05060f',
      theme_color:'#05060f',
      icons:[
        {src:iconUrl,sizes:'512x512',type:'image/png',purpose:'any'},
        {src:iconUrl,sizes:'192x192',type:'image/png',purpose:'maskable'}
      ]
    };
    var link=document.createElement('link');
    link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }catch(err){ /* manifest is progressive enhancement; app still runs */ }
})();
</script>

<script>
'use strict';
/* ============================================================
   ARCADE FORGE - self-contained game-generating PWA.
   All systems live in this single script block:
   data tables, state machine, wizard UI, vault persistence,
   high-DPI delta-time engine, three genre constructors,
   twin-weapon systems, hazards, ultimates, VFX pool, controls.
   ============================================================ */

/* ---------------- UTILITIES ---------------- */
const TAU=Math.PI*2;
const $$=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rand=(a,b)=>a+Math.random()*(b-a);
const dist2=(ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay;return dx*dx+dy*dy;};
const normAngle=a=>((a+Math.PI*3)%TAU)-Math.PI;
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circleRectHit(cx,cy,r,rc){
  const nx=clamp(cx,rc.x,rc.x+rc.w),ny=clamp(cy,rc.y,rc.y+rc.h);
  const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<=r*r;
}
function hash01(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function distPointSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const len2=dx*dx+dy*dy;
  if(len2<=0)return Math.hypot(px-x1,py-y1);
  const t=clamp(((px-x1)*dx+(py-y1)*dy)/len2,0,1);
  return Math.hypot(px-(x1+dx*t),py-(y1+dy*t));
}
function roundRectPath(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function hexPath(c,cx,cy,r,rot){
  c.beginPath();
  for(let i=0;i<6;i++){
    const a=rot+i/6*TAU;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
  }
  c.closePath();
}

/* ---------------- CONFIGURATION DATA TABLES ---------------- */
const GENRES=[

];

   desc:'Medium threat. Balanced combat calibration, 1.5x score.',
   mods:{hp:1.0,dmgTaken:1.0,eHp:1.0,eSpd:1.0,spawn:1.0,score:1.5}},

   mods:{hp:0.75,dmgTaken:1.5,eHp:1.35,eSpd:1.15,spawn:1.35,score:2.25}}
];
const ENEMY_TYPES=[

];
const ENVS=[
  {name:'VOLCANIC JUNGLE',hazard:'LAVA HAZARD',icon:'\u25B2',accent:'#ff7a3c',
   desc:'Smoldering canopy over magma veins. Lava geysers erupt from the ground.',

   pal:{sky0:'#0a0712',sky1:'#1e1430',ground:'#171028',edge:'#9d6bff',plat:'#1f1535',line:'#c9a6ff'}}
];

  {key:'env',title:'ENVIRONMENT & HAZARD',sub:'DEPLOYMENT ZONE',opts:ENVS},
  {key:'ult',title:'SELECT ULTIMATE',sub:'LIMIT-BREAK PROTOCOL',opts:ULTS}
];

/* ---------------- VAULT (localStorage persistence) ---------------- */
const VAULT_KEY='arcade_forge_vault';
function loadVault(){
  try{
    const raw=localStorage.getItem(VAULT_KEY);
    if(!raw)return[];
    const v=JSON.parse(raw);
    if(!Array.isArray(v))return[];
    const clean=v.filter(e=>e&&Array.isArray(e.cfg)&&e.cfg.length===6);
    /* migrate v1 saves: runner(1) folds into platformer(0), arena 2 -> 1 */
    let changed=false;
    for(const e of clean){
      if(e.v!==2){
        e.cfg[0]=e.cfg[0]===2?1:0;
        e.v=2;
        changed=true;
      }
      e.cfg[0]=clamp(e.cfg[0],0,GENRES.length-1);
    }
    if(changed)saveVault(clean);
    return clean;
  }catch(err){return[];}
}
function saveVault(v){
  try{localStorage.setItem(VAULT_KEY,JSON.stringify(v));}catch(err){}
}
function cfgLabel(cfg){
  return GENRES[cfg[0]].short+' \u00B7 '+HEROES[cfg[1]].name+' \u00B7 '+DIFFS[cfg[2]].name+' \u00B7 '+ENVS[cfg[4]].name;
}

/* ============================================================
   APPLICATION STATE MACHINE
   States: HOME_MENU, WIZARD_STEP, GAME_SUMMARY, ACTIVE_GAME,
           GAME_OVER, VICTORY
   ============================================================ */
let appState='HOME_MENU';
const SCREENS={
  HOME_MENU:'screen-home',
  WIZARD_STEP:'screen-wizard',
  GAME_SUMMARY:'screen-summary',
  ACTIVE_GAME:'screen-game',
  GAME_OVER:'screen-end',
  VICTORY:'screen-end'
};
let wizardIdx=0;
let wizardSel=[0,0,0,0,0,0];
let lastCfg=null;
let saveFeedbackTimer=null;

function setAppState(next){
  if(appState==='ACTIVE_GAME'&&next!=='ACTIVE_GAME')cleanupGame();
  appState=next;
  ['screen-home','screen-wizard','screen-summary','screen-game','screen-end']
    .forEach(id=>$$('#'+id).classList.add('hidden'));
  $$('#'+SCREENS[next]).classList.remove('hidden');
  if(next==='HOME_MENU')renderHome();
  else if(next==='WIZARD_STEP')renderWizard();
  else if(next==='GAME_SUMMARY')renderSummary();
  else if(next==='GAME_OVER'||next==='VICTORY')renderEnd(next==='VICTORY');
}

function commitToVault(){
  const input=$$('#sum-name');
  let name=(input.value||'').trim().toUpperCase();
  if(!name)name='RIG-'+String(Date.now()%100000).padStart(5,'0');
  const vault=loadVault();
  vault.unshift({name:name,cfg:wizardSel.slice(),ts:Date.now(),v:2});
  while(vault.length>30)vault.pop();
  saveVault(vault);
  const saveBtn=$$('#btn-save');
  saveBtn.textContent='SAVED TO VAULT \u2713';
  if(saveFeedbackTimer)clearTimeout(saveFeedbackTimer);
  saveFeedbackTimer=setTimeout(()=>{
    saveBtn.textContent='SAVE TO VAULT';
    saveFeedbackTimer=null;
  },1400);
}

const G={

/* ---------------- HIGH-DPI CANVAS ---------------- */
function setupCanvas(){
  dpr=clamp(window.devicePixelRatio||1,1,3);
  viewW=window.innerWidth;
  viewH=window.innerHeight;
  canvas.width=Math.round(viewW*dpr);
  canvas.height=Math.round(viewH*dpr);
  canvas.style.width='100%';
  canvas.style.height='100%';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  layoutControls();
}
function onResize(){
  if(!canvas)return;
  setupCanvas();
  if(G.running&&G.cfg&&G.cfg.genre===1){
    buildArenaWalls();
    player.x=clamp(player.x,24,viewW-24-player.w);
    player.y=clamp(player.y,24,viewH-24-player.h);
  }
}

/* ---------------- VIRTUAL CONTROLS (PointerEvents) ---------------- */
const activePointers=new Map();
const stick={active:false,id:null,ox:0,oy:0,dx:0,dy:0,nx:0,ny:0,mag:0,rad:56,restX:90,restY:0};
const vbtns=[
  {key:'primary',label:'FIRE',x:0,y:0,r:44,held:false},
  {key:'secondary',label:'SPC',x:0,y:0,r:36,held:false},
  {key:'ult',label:'ULT',x:0,y:0,r:36,held:false}
];
const quitBtn={x:0,y:30,r:20};

function layoutControls(){
  const m=Math.min(viewW,viewH);
  stick.rad=clamp(m*0.115,46,66);
  stick.restX=stick.rad+36;
  stick.restY=viewH-stick.rad-46;
  const r=clamp(m*0.088,34,52);
  const b1=vbtns[0],b2=vbtns[1],b3=vbtns[2];
  b1.r=r;      b1.x=viewW-r-26;            b1.y=viewH-r-36;
  b2.r=r*0.78; b2.x=viewW-r*2-b2.r-58;     b2.y=viewH-b2.r-28;
  b3.r=r*0.8;  b3.x=viewW-r-28;            b3.y=b1.y-r-b3.r-24;
  quitBtn.x=viewW-28;
  quitBtn.y=Math.max(30,16+(window.visualViewport?0:0)+14);
}
function resetStick(){
  stick.active=false;stick.id=null;
  stick.dx=0;stick.dy=0;stick.nx=0;stick.ny=0;stick.mag=0;
}
function pointerPos(e){
  const rect=canvas.getBoundingClientRect();
  return{x:e.clientX-rect.left,y:e.clientY-rect.top};
}
function onPointerDown(e){
  e.preventDefault();
  const p=pointerPos(e);
  if(dist2(p.x,p.y,quitBtn.x,quitBtn.y)<(quitBtn.r+8)*(quitBtn.r+8)){
    setAppState('HOME_MENU');
    return;
  }
  for(const b of vbtns){
    if(dist2(p.x,p.y,b.x,b.y)<=(b.r*1.25)*(b.r*1.25)){
      activePointers.set(e.pointerId,{type:'btn',btn:b});
      b.held=true;
      if(b.key==='secondary')trySecondary();
      else if(b.key==='ult')tryUltimate();
      return;
    }
  }
  if(p.x<viewW*0.55&&!stick.active){
    stick.active=true;
    stick.id=e.pointerId;
    stick.ox=p.x;stick.oy=p.y;
    stick.dx=0;stick.dy=0;stick.nx=0;stick.ny=0;stick.mag=0;
    activePointers.set(e.pointerId,{type:'stick'});
  }
}
function onPointerMove(e){
  const entry=activePointers.get(e.pointerId);
  if(!entry)return;
  e.preventDefault();
  if(entry.type==='stick'&&e.pointerId===stick.id){
    const p=pointerPos(e);
    let dx=p.x-stick.ox,dy=p.y-stick.oy;
    const d=Math.hypot(dx,dy);
    if(d>stick.rad){dx*=stick.rad/d;dy*=stick.rad/d;}
    stick.dx=dx;stick.dy=dy;
    stick.nx=dx/stick.rad;stick.ny=dy/stick.rad;
    stick.mag=Math.min(1,d/stick.rad);
  }
}
function onPointerUp(e){
  const entry=activePointers.get(e.pointerId);
  if(!entry)return;
  if(entry.type==='stick'&&e.pointerId===stick.id)resetStick();
  if(entry.type==='btn')entry.btn.held=false;
  activePointers.delete(e.pointerId);
}
function onCtxMenu(e){e.preventDefault();}

function attachGameInput(){
  canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
  canvas.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp,{passive:false});
  window.addEventListener('pointercancel',onPointerUp,{passive:false});
  canvas.addEventListener('contextmenu',onCtxMenu);
}
function detachGameInput(){
  canvas.removeEventListener('pointerdown',onPointerDown);
  canvas.removeEventListener('pointermove',onPointerMove);
  window.removeEventListener('pointerup',onPointerUp);
  window.removeEventListener('pointercancel',onPointerUp);
  canvas.removeEventListener('contextmenu',onCtxMenu);
  activePointers.clear();
  resetStick();
  for(const b of vbtns)b.held=false;
}

/* ---------------- GAME LIFECYCLE ---------------- */
function initGame(cfgArr){
  G.cfg={genre:cfgArr[0],hero:cfgArr[1],diff:cfgArr[2],enemy:cfgArr[3],env:cfgArr[4],ult:cfgArr[5]};
  G.level=1;G.score=0;G.totalKills=0;G.gameTime=0;
  G.over=false;G.victory=false;G.endT=0;

  G.shakeT=0;G.shakeMag=0;G.dmgFlash=0;
  setupCanvas();
  initPlayer();
  buildWorld();
  attachGameInput();
  G.running=true;
  lastTs=performance.now();
  if(rafId!==null)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function cleanupGame(){
  if(rafId!==null){cancelAnimationFrame(rafId);rafId=null;}
  detachGameInput();
  G.running=false;
}
function initPlayer(){

/* ---------------- GENRE-SPECIFIC WORLD CONSTRUCTOR ---------------- */
function buildWorld(){
  enemies.length=0;projs.length=0;eprojs.length=0;
  platforms.length=0;walls.length=0;
  hazards.length=0;pickups.length=0;wisps.length=0;
  telegraphs.length=0;clusters.length=0;
  solids.length=0;dmgTexts.length=0;shockwaves.length=0;
  G.pits.length=0;
  G.lastSafeX=70;
  for(const p of particles)p.active=false;
  const D=diffMods();
  const g=G.cfg.genre,lvl=G.level;
  G.kills=0;G.spawned=0;
  G.envT=2.4;G.enSpawnT=1.2;
  G.portal=null;
  player.vx=0;player.vy=0;
  player.h=player.baseH;

  if(g===0){
    buildPlatformerWorld(lvl,D);
  } else {
    /* TOP-DOWN ARENA: perimeter boundary locks the combat zone */
    G.worldW=viewW;
    G.groundY=viewH;
    G.camX=0;
    buildArenaWalls();
    G.killQuota=8+lvl*3;
    G.maxAlive=Math.round((3+lvl*0.7)*D.spawn);
    G.enSpawnT=0.8;
    player.x=viewW/2-player.w/2;
    player.y=viewH/2-player.h/2;
  }
  G.bannerText='LEVEL '+lvl+' / 10';
  G.bannerSub=g===0?'REACH THE EXIT PORTAL':'PURGE '+G.killQuota+' HOSTILES';
  G.bannerT=2.4;
}
/* SIDE-SCROLLER PLATFORMER: chunk-based terrain generator.
   Stitches features left-to-right: flat runs with ledges, jumpable
   pits (themed bottoms), platform gauntlets over giant pits,
   staircases with plateaus, jump-over walls and low tunnels. */
function insidePit(x){
  for(const p of G.pits)if(x>p.x1-30&&x<p.x2+30)return true;
  return false;
}
function buildPlatformerWorld(lvl,D){
  G.groundY=Math.round(viewH*0.78);
  G.camX=0;
  const gy=G.groundY;
  let x=0;
  const addGround=w=>{
    solids.push({x:x,y:gy,w:w,h:viewH-gy+260});
    x+=w;
  };
  const maybeLedgePickup=(px,py)=>{
    if(Math.random()<0.15)pickups.push({x:px,y:py-26,kind:Math.floor(Math.random()*3),t:0,life:9999});
  };
  addGround(560); /* safe runway */
  const featureCount=4+Math.min(6,Math.floor(lvl*0.8));
  for(let f=0;f<featureCount;f++){
    const roll=Math.random();
    if(roll<0.17){
      /* PIT - a clean jumpable gap */
      const pw=115+rand(0,45)+Math.min(15,lvl*1.5);
      G.pits.push({x1:x,x2:x+pw});
      x+=pw;
      addGround(250+rand(0,150));
    } else if(roll<0.34){
      /* GAUNTLET - giant pit bridged by small floating platforms */
      const pw=380+rand(0,240);
      const n=3+Math.floor(pw/170);
      for(let i=0;i<n;i++){
        const px=x+(pw/(n+1))*(i+1)-40+rand(-16,16);
        const py=gy-(62+(i%2)*44+rand(0,26));
        platforms.push({x:px,y:py,w:64+rand(0,26),h:14});
        maybeLedgePickup(px+40,py);
        if(G.cfg.enemy===0&&Math.random()<0.5)enemies.push(makeEnemy(px,py-130));
      }
      G.pits.push({x1:x,x2:x+pw});
      x+=pw;
      addGround(260+rand(0,140));
    } else if(roll<0.51){
      /* STAIRCASE - climb up, plateau, run down the far side */
      const steps=3+Math.floor(rand(0,3)),sw=72,sh=27;
      for(let i=0;i<steps;i++)solids.push({x:x+i*sw,y:gy-sh*(i+1),w:sw,h:sh*(i+1)});
      const plw=120+rand(0,90);
      solids.push({x:x+steps*sw,y:gy-sh*steps,w:plw,h:sh*steps});
      if(Math.random()<0.6)enemies.push(makeEnemy(x+steps*sw+plw*0.4,gy-sh*steps-44));
      maybeLedgePickup(x+steps*sw+plw*0.6,gy-sh*steps);
      for(let i=steps-1;i>=0;i--){
        solids.push({x:x+steps*sw+plw+(steps-1-i)*sw,y:gy-sh*(i+1),w:sw,h:sh*(i+1)});
      }
      addGround(steps*sw*2+plw);
      addGround(170+rand(0,120));
    } else if(roll<0.68){
      /* WALL - a solid block you must jump over */
      const flatW=300+rand(0,140);
      const wh=62+rand(0,24)+Math.min(14,lvl*1.5);
      solids.push({x:x+flatW*0.45,y:gy-wh,w:40,h:wh});
      addGround(flatW);
    } else if(roll<0.84){
      /* TUNNEL - low corridor under a ceiling slab */
      const tw=230+rand(0,110);
      solids.push({x:x+30,y:gy-58-64,w:tw-60,h:64});
      if(G.cfg.enemy!==0&&Math.random()<0.6)enemies.push(makeEnemy(x+tw*0.5,gy-44));
      addGround(tw);
    } else {
      /* FLAT - open ground with bonus ledges */
      const fw=320+rand(0,180);
      const ln=1+Math.floor(rand(0,2));
      for(let i=0;i<ln;i++){
        const lw=130+rand(0,110);
        const px=x+60+rand(0,Math.max(40,fw-lw-120));
        const py=gy-(88+rand(0,36));
        platforms.push({x:px,y:py,w:lw,h:16});
        maybeLedgePickup(px+lw/2,py);
      }
      addGround(fw);
    }
  }
  addGround(520); /* final runway */
  G.worldW=x;
  G.portal={x:x-118,y:gy-96,w:48,h:96};
  player.x=70;player.y=gy-player.h;
  /* sprinkle roaming hostiles across the route, avoiding pits */
  const count=Math.round((5+lvl*1.7)*D.spawn);
  let placed=0,guard=0;
  while(placed<count&&guard<count*30){
    guard++;
    const ex=rand(500,G.worldW-380);
    if(G.cfg.enemy===0){
      enemies.push(makeEnemy(ex,gy-rand(120,260)));
      placed++;
    }else if(!insidePit(ex)&&!insidePit(ex+40)){
      enemies.push(makeEnemy(ex,gy-44));
      placed++;
    }
  }
}
function buildArenaWalls(){
  walls.length=0;
  const t=12,m=6;
  walls.push({x:m,y:m,w:viewW-m*2,h:t});
  walls.push({x:m,y:viewH-m-t,w:viewW-m*2,h:t});
  walls.push({x:m,y:m,w:t,h:viewH-m*2});
  walls.push({x:viewW-m-t,y:m,w:t,h:viewH-m*2});
}
function resolveWalls(ent){
  for(const w of walls){
    if(!rectsOverlap(ent,w))continue;
    const ox1=ent.x+ent.w-w.x,ox2=w.x+w.w-ent.x;
    const oy1=ent.y+ent.h-w.y,oy2=w.y+w.h-ent.y;
    const ox=Math.min(ox1,ox2),oy=Math.min(oy1,oy2);
    if(ox<oy){
      if(ox1<ox2){ent.x-=ox1;if(ent.vx>0)ent.vx=0;}
      else{ent.x+=ox2;if(ent.vx<0)ent.vx=0;}
    }else{
      if(oy1<oy2){ent.y-=oy1;if(ent.vy>0)ent.vy=0;}
      else{ent.y+=oy2;if(ent.vy<0)ent.vy=0;}
    }
  }
}
function groundLand(ent,prevY){
  ent.onGround=false;
  for(const p of platforms){
    if(ent.vy>=0&&prevY+ent.h<=p.y+8&&
       ent.x+ent.w>p.x+2&&ent.x<p.x+p.w-2&&
       ent.y+ent.h>=p.y&&ent.y+ent.h<=p.y+p.h+36){
      ent.y=p.y-ent.h;ent.vy=0;ent.onGround=true;
    }
  }
  for(const s of solids){
    if(ent.vy>=0&&prevY+ent.h<=s.y+8&&
       ent.x+ent.w>s.x+2&&ent.x<s.x+s.w-2&&
       ent.y+ent.h>=s.y&&ent.y+ent.h<=s.y+36){
      ent.y=s.y-ent.h;ent.vy=0;ent.onGround=true;
    }
  }
}
function resolveSolidsX(ent){
  for(const s of solids){
    if(!rectsOverlap(ent,s))continue;
    if(ent.y+ent.h<=s.y+6)continue; /* feet at the top: not a side hit */
    const ox1=ent.x+ent.w-s.x,ox2=s.x+s.w-ent.x;
    if(ox1<ox2)ent.x-=ox1;else ent.x+=ox2;
    ent.vx=0;
  }
}
function resolveSolidsY(ent,prevY){
  for(const s of solids){
    if(!rectsOverlap(ent,s))continue;
    if(ent.vy>=0&&prevY+ent.h<=s.y+8){
      ent.y=s.y-ent.h;ent.vy=0;ent.onGround=true;
    }else if(ent.vy<0&&prevY>=s.y+s.h-8){
      ent.y=s.y+s.h;ent.vy=0;
    }else{
      const oy1=ent.y+ent.h-s.y,oy2=s.y+s.h-ent.y;
      if(oy1<oy2){ent.y-=oy1;ent.vy=Math.min(ent.vy,0);ent.onGround=true;}
      else{ent.y+=oy2;ent.vy=Math.max(ent.vy,0);}
    }
  }
}
function pitFall(){
  player.hp-=player.maxHp*0.25;
  G.dmgFlash=0.45;
  addShake(7,0.3);
  player.invulnT=1.2;
  player.x=clamp(G.lastSafeX,0,G.worldW-player.w);
  player.y=G.groundY-player.h;
  player.vx=0;player.vy=0;
  burstParticles(player.x+player.w/2,player.y+player.h/2,12,200,3,0.45,[255,160,140],[200,40,30],0);
  if(player.hp<=0){player.hp=0;die();}
}

/* ---------------- DELTA-TIME GAME LOOP ---------------- */
function loop(ts){
  rafId=requestAnimationFrame(loop);
  if(!G.running)return;
  let dt=(ts-lastTs)/1000;
  lastTs=ts;
  if(!(dt>0))dt=0.0001;
  if(dt>0.05)dt=0.05;
  update(dt);
  render();
}

function update(dt){
  G.gameTime+=dt;
  if(G.shakeT>0)G.shakeT-=dt;
  if(G.over){
    G.endT-=dt;
    updateParticles(dt);
    updateClusters(dt);
    if(G.endT<=0){
      const victory=G.victory;
      G.running=false;
      setAppState(victory?'VICTORY':'GAME_OVER');
    }
    return;
  }
  if(G.isTimeStopped){
    G.timeStopT-=dt;
    if(G.timeStopT<=0){
      G.isTimeStopped=false;
      burstParticles(player.x+player.w/2,player.y+player.h/2,14,180,3,0.4,[155,232,255],[60,90,160],0);
    }
  }
  if(player.invulnT>0)player.invulnT-=dt;
  if(player.shieldUltT>0)player.shieldUltT-=dt;
  if(player.overdriveT>0)player.overdriveT-=dt;
  if(G.dmgFlash>0)G.dmgFlash-=dt;
  if(G.bannerT>0)G.bannerT-=dt;
  if(G.levelFlashT>0)G.levelFlashT-=dt;

  updatePlayer(dt);
  updateWeapons(dt);
  updateWisps(dt);
  updateProjectiles(dt);
  updateClusters(dt);
  if(!G.isTimeStopped){
    updateEnemies(dt);
    updateEnemyProjectiles(dt);
    updateHazards(dt);
    updateSpawners(dt);
  }
  updatePickups(dt);
  handleProjectileHits();
  handlePlayerCollisions(dt);
  updateDmgTexts(dt);
  updateShockwaves(dt);
  updateParticles(dt);
  updateCamera(dt);
  checkLevelProgress();
  cleanupDead();
}

/* ---------------- PLAYER PHYSICS (per genre) ---------------- */
function updatePlayer(dt){
  if(player.dead)return;
  const ov=player.overdriveT>0;
  const g=G.cfg.genre;
  if(player.landT>0)player.landT-=dt;
  if(player.shieldHitT>0)player.shieldHitT-=dt;
  if(g===0){
    const spd=252*(ov?1.4:1);
    player.vx+=(stick.nx*spd-player.vx)*Math.min(1,dt*12);
    player.vy+=1500*dt;
    if(player.vy>950)player.vy=950;
    const wantJump=stick.ny<-0.45;
    if(wantJump&&player.onGround&&!player.jumpHeld){
      player.vy=-635;player.onGround=false;
      burstParticles(player.x+player.w/2,player.y+player.h,6,90,2.5,0.35,[200,230,255],[80,120,160],260);
    }
    player.jumpHeld=wantJump;
    const prevY=player.y;
    const wasGround=player.onGround;
    const fallSpeed=player.vy;
    player.x+=player.vx*dt;
    player.x=clamp(player.x,0,G.worldW-player.w);
    resolveSolidsX(player);
    player.y+=player.vy*dt;
    resolveSolidsY(player,prevY);
    groundLand(player,prevY);
    if(player.onGround&&!wasGround&&fallSpeed>280){
      /* landing: squash + dust puff */
      player.landT=0.14;
      burstParticles(player.x+player.w/2,player.y+player.h,8,110,2.6,0.35,[210,225,240],[90,110,140],180);
    }
    if(player.onGround&&Math.abs(player.y+player.h-G.groundY)<3)G.lastSafeX=player.x;
    if(player.y>viewH+80)pitFall();
  } else {
    const acc=1500*(ov?1.3:1),maxV=330*(ov?1.35:1);
    player.vx+=stick.nx*acc*dt;
    player.vy+=stick.ny*acc*dt;
    const drag=Math.max(0,1-4.5*dt);
    if(Math.abs(stick.nx)<0.12)player.vx*=drag;
    if(Math.abs(stick.ny)<0.12)player.vy*=drag;
    const sp=Math.hypot(player.vx,player.vy);
    if(sp>maxV){player.vx*=maxV/sp;player.vy*=maxV/sp;}
    player.x+=player.vx*dt;
    player.y+=player.vy*dt;
    resolveWalls(player);
  }
  if(Math.abs(stick.nx)>0.2)player.facing=stick.nx>0?1:-1;
  if(ov){
    /* overdrive: afterimage trail + licking fire aura */
    player.trailT-=dt;
    if(player.trailT<=0){
      player.trailT=0.05;
      spawnParticle(player.x+player.w/2,player.y+player.h/2,
        -player.vx*0.25+rand(-20,20),-player.vy*0.25+rand(-20,20),
        5,0.32,[255,179,71],[200,40,20],0);
    }
    player.auraT-=dt;
    while(player.auraT<=0){
      player.auraT+=0.035;
      const ax=player.x+rand(2,player.w-2);
      const ay=player.y+rand(player.h*0.3,player.h);
      spawnParticle(ax,ay,rand(-14,14),-rand(60,150),
        2.2+rand(0,2),0.3+rand(0,0.2),[255,210,110],[255,50,10],-160);
    }
  }
}

/* ---------------- SERVICE WORKER (self-contained Blob URL) ---------------- */
function registerServiceWorker(){
  if(!('serviceWorker' in navigator))return;
  try{
    const swCode=
      "const CACHE='arcade-forge-v1';"+
      "self.addEventListener('install',e=>{"+
        "e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']).catch(()=>{})));"+
        "self.skipWaiting();"+
      "});"+
      "self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});"+
      "self.addEventListener('fetch',e=>{"+
        "e.respondWith("+
          "caches.match(e.request).then(hit=>hit||fetch(e.request).then(net=>{"+
            "const copy=net.clone();"+
            "caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});"+
            "return net;"+
          "}).catch(()=>caches.match('./')))"+
        ");"+
      "});";
    const blobUrl=URL.createObjectURL(new Blob([swCode],{type:'text/javascript'}));
    navigator.serviceWorker.register(blobUrl,{scope:'./'})
      .then(()=>{ /* offline cache armed */ })
      .catch(err=>{
        /* Some engines refuse blob: SW scripts; the app remains fully functional. */
        console.info('ArcadeForge SW (blob) unavailable:',err&&err.message);
      });
  }catch(err){
    console.info('ArcadeForge SW setup skipped:',err&&err.message);
  }
}

/* ============================================================
   VFX PARTICLE MATRIX - pre-allocated pool of 300 objects

const PARTICLE_POOL=300;
const particles=new Array(PARTICLE_POOL);
for(let i=0;i<PARTICLE_POOL;i++){
  particles[i]={active:false,x:0,y:0,vx:0,vy:0,size:0,life:0,maxLife:1,
                r0:255,g0:255,b0:255,r1:255,g1:255,b1:255,grav:0,decay:0.9};
}
let particleCursor=0;
function spawnParticle(x,y,vx,vy,size,life,c0,c1,grav){
  const p=particles[particleCursor];
  particleCursor=(particleCursor+1)%PARTICLE_POOL;
  p.active=true;
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;
  p.size=size;p.life=life;p.maxLife=life;
  p.r0=c0[0];p.g0=c0[1];p.b0=c0[2];
  p.r1=c1[0];p.g1=c1[1];p.b1=c1[2];
  p.grav=grav||0;
  p.decay=0.92;
}
function burstParticles(x,y,count,speed,size,life,c0,c1,grav){
  for(let i=0;i<count;i++){
    const a=Math.random()*TAU;
    const sp=speed*(0.35+Math.random()*0.65);
    spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,
      size*(0.6+Math.random()*0.8),life*(0.6+Math.random()*0.8),c0,c1,grav);
  }
}
function updateParticles(dt){
  for(const p of particles){
    if(!p.active)continue;
    p.life-=dt;
    if(p.life<=0){p.active=false;continue;}
    p.vy+=p.grav*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=Math.max(0,1-1.6*dt);
    p.vy*=Math.max(0,1-1.6*dt);
  }
}

/* ============================================================
   TWIN-WEAPON & COOLDOWN ENGINE
   ============================================================ */
function isBuried(en){return en.type===2&&en.rootState!=='idle';}
function nearestEnemyTo(x,y,maxDist){
  let best=null,bestD=maxDist*maxDist;
  for(const en of enemies){
    if(en.dead||isBuried(en))continue;
    const d=dist2(x,y,en.x+en.w/2,en.y+en.h/2);
    if(d<bestD){bestD=d;best=en;}
  }
  return best;
}
function getAim(){
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  const t=nearestEnemyTo(pcx,pcy,560);
  if(t){
    const dx=t.x+t.w/2-pcx,dy=t.y+t.h/2-pcy;
    const d=Math.hypot(dx,dy)||1;
    return{x:dx/d,y:dy/d};
  }
  if(G.cfg.genre===1&&(Math.abs(stick.nx)>0.25||Math.abs(stick.ny)>0.25)){
    const m=Math.hypot(stick.nx,stick.ny)||1;
    return{x:stick.nx/m,y:stick.ny/m};
  }
  return{x:player.facing,y:0};
}

function updateWisps(dt){
